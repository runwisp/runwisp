# =============================================================================
# RunWisp station protocol v1: COMPATIBILITY CONTRACT. Read before editing.
#
# Daemons ship separately from stations and stay in the field for years. A
# daemon built against v1.0 of this file must keep working against every later
# station, and a later daemon against every v1 station. So v1 only ever grows:
#
#   1. Never remove, rename, retype or repurpose a message, field, feature
#      name, error code or enum value. Deprecate by no longer sending it; keep
#      accepting it.
#   2. Adding an optional field is safe: receivers ignore fields they don't
#      know. A field the receiver MUST honour (a limit, a security setting)
#      belongs to a feature; the sender puts that feature in the envelope's
#      `requires` whenever it sets the field.
#   3. Adding a message type is safe: receivers ignore types they don't know,
#      except that an unknown COMMAND (an envelope with an `id`) is answered
#      with a `result` carrying error code `unsupported`. A sender that depends
#      on a new command checks the peer's features first.
#   4. Enums are open unless marked CLOSED. Receivers tolerate unknown values
#      of an open enum by falling back to the closed field next to it (e.g. an
#      unknown execution `reason` falls back to `isFailure`). CLOSED enums
#      never grow.
#   5. The major version is the WebSocket subprotocol (`runwisp.v1`). There is
#      no version number inside messages. A v2 would be offered next to v1.
#   6. Regenerate Go/TS types from this file; never hand-edit the output.
# =============================================================================
asyncapi: 2.6.0
info:
  title: RunWisp station protocol
  version: 1.0.0
  description: |
    WebSocket protocol between a RunWisp daemon and a station. The daemon
    always dials out; nothing dials the daemon.

    ## Transport

    The daemon opens a WebSocket to `/api/v1/runner/ws` with
    `Authorization: Bearer <runner token>` and
    `Sec-WebSocket-Protocol: runwisp.v1`. A station that answers without
    selecting `runwisp.v1` doesn't speak this protocol. Text frames carry one
    JSON message each. Binary frames are reserved and ignored.

    ## Envelope

    Every frame is an `Envelope`; the message's payload is its `data`.
    A frame with an `id` is a COMMAND and gets exactly one `result` with
    `replyTo` set to that id (a log subscription first streams `log:lines`
    frames with the same `replyTo`, then ends with its `result`). Ids are
    unique per sender per connection.

    ## Session

    1. daemon -> `hello` (first frame, nothing else before it)
    2. station -> `welcome`, or `goodbye` and close
    3. daemon resends every unacknowledged `execution:update`, sends
       `service:status` for each service, and `tasks:sync` when
       `welcome.tasksHashKnown` is false.

    Either side may send `goodbye` and close at any time. Liveness: the daemon
    sends `ping` every `welcome.heartbeat.intervalMs`; the station answers
    `pong`. A side that hears nothing for `heartbeat.timeoutMs` closes.

    ## Delivery

    `execution:update` carries `seq`, increasing per daemon install and kept
    across restarts. The daemon stores each update before sending it and
    deletes it once the station's `ack` covers its seq. The station acks only
    after applying the update durably. Applying an update is idempotent, so
    resends are harmless.

    ## Conventions

    Durations are integer milliseconds (`...Ms`), sizes integer bytes, times
    RFC 3339 UTC strings, ids opaque strings up to 128 bytes. Log text is
    valid UTF-8 (invalid bytes become U+FFFD). Arrays are `[]`, never `null`.

defaultContentType: application/json

channels:
  stationToDaemon:
    description: Frames the station sends.
    publish:
      message:
        oneOf:
          - $ref: "#/components/messages/welcome"
          - $ref: "#/components/messages/goodbye"
          - $ref: "#/components/messages/pong"
          - $ref: "#/components/messages/result"
          - $ref: "#/components/messages/ack"
          - $ref: "#/components/messages/sessionUpdate"
          - $ref: "#/components/messages/executionDispatch"
          - $ref: "#/components/messages/executionStop"
          - $ref: "#/components/messages/logSubscribe"
          - $ref: "#/components/messages/logUnsubscribe"
          - $ref: "#/components/messages/logSearch"
          - $ref: "#/components/messages/serviceApply"
          - $ref: "#/components/messages/serviceControl"
          - $ref: "#/components/messages/serviceRemove"
          - $ref: "#/components/messages/agentRestart"
          - $ref: "#/components/messages/agentUpgrade"
          - $ref: "#/components/messages/agentCredentials"

  daemonToStation:
    description: Frames the daemon sends.
    subscribe:
      message:
        oneOf:
          - $ref: "#/components/messages/hello"
          - $ref: "#/components/messages/goodbye"
          - $ref: "#/components/messages/ping"
          - $ref: "#/components/messages/result"
          - $ref: "#/components/messages/agentUpdate"
          - $ref: "#/components/messages/agentStats"
          - $ref: "#/components/messages/tasksSync"
          - $ref: "#/components/messages/executionUpdate"
          - $ref: "#/components/messages/logLines"
          - $ref: "#/components/messages/uploadRequest"
          - $ref: "#/components/messages/serviceStatus"

components:
  messages:
    # --- session -------------------------------------------------------------
    hello:
      name: hello
      summary: daemon -> station. First frame; identity, features, inventory.
      payload: { $ref: "#/components/schemas/Hello" }
    welcome:
      name: welcome
      summary: station -> daemon. Accepts the session and sets its parameters.
      payload: { $ref: "#/components/schemas/Welcome" }
    goodbye:
      name: goodbye
      summary: Either side, just before closing. Says whether and when to come back.
      payload: { $ref: "#/components/schemas/Goodbye" }
    ping:
      name: ping
      summary: daemon -> station. Heartbeat. No data.
      payload: { $ref: "#/components/schemas/Empty" }
    pong:
      name: pong
      summary: station -> daemon. Heartbeat reply. No data.
      payload: { $ref: "#/components/schemas/Empty" }
    result:
      name: result
      summary: The single reply to a command; `replyTo` names it.
      payload: { $ref: "#/components/schemas/Result" }
    ack:
      name: ack
      summary: station -> daemon. Every execution:update up to seq is applied.
      payload: { $ref: "#/components/schemas/Ack" }
    sessionUpdate:
      name: session:update
      summary: station -> daemon, command. Changes session parameters.
      payload: { $ref: "#/components/schemas/SessionUpdate" }

    # --- agent ---------------------------------------------------------------
    agentUpdate:
      name: agent:update
      summary: daemon -> station. Identity or features changed mid-session.
      payload: { $ref: "#/components/schemas/AgentUpdate" }
    agentStats:
      name: agent:stats
      summary: daemon -> station. Host snapshot, every welcome.statsIntervalMs.
      payload: { $ref: "#/components/schemas/AgentStats" }
    agentRestart:
      name: agent:restart
      summary: station -> daemon, command. Restart the daemon process. Feature agent.restart.
      payload: { $ref: "#/components/schemas/Empty" }
    agentUpgrade:
      name: agent:upgrade
      summary: station -> daemon, command. Install a release and restart. Feature agent.upgrade.
      payload: { $ref: "#/components/schemas/AgentUpgrade" }
    agentCredentials:
      name: agent:credentials
      summary: station -> daemon, command. Replace the runner token.
      payload: { $ref: "#/components/schemas/AgentCredentials" }

    # --- tasks ---------------------------------------------------------------
    tasksSync:
      name: tasks:sync
      summary: daemon -> station, command. The daemon's whole task catalog.
      payload: { $ref: "#/components/schemas/TasksSync" }

    # --- executions ----------------------------------------------------------
    executionDispatch:
      name: execution:dispatch
      summary: station -> daemon, command. Run one execution. Result ok = accepted.
      payload: { $ref: "#/components/schemas/ExecutionDispatch" }
    executionStop:
      name: execution:stop
      summary: station -> daemon, command. Stop a running execution.
      payload: { $ref: "#/components/schemas/ExecutionStop" }
    executionUpdate:
      name: execution:update
      summary: daemon -> station. Sequenced, stored until acked.
      payload: { $ref: "#/components/schemas/ExecutionUpdate" }

    # --- logs ----------------------------------------------------------------
    logSubscribe:
      name: log:subscribe
      summary: station -> daemon, command. Stream an execution's log lines.
      payload: { $ref: "#/components/schemas/LogSubscribe" }
    logUnsubscribe:
      name: log:unsubscribe
      summary: station -> daemon. End a log:subscribe subscription; the daemon sends its result.
      payload: { $ref: "#/components/schemas/LogUnsubscribe" }
    logLines:
      name: log:lines
      summary: daemon -> station. Lines for the subscription named in replyTo.
      payload: { $ref: "#/components/schemas/LogLines" }
    logSearch:
      name: log:search
      summary: station -> daemon, command. Grep one execution's log.
      payload: { $ref: "#/components/schemas/LogSearch" }
    uploadRequest:
      name: upload:request
      summary: daemon -> station, command. Signed upload targets.
      payload: { $ref: "#/components/schemas/UploadRequest" }

    # --- services ------------------------------------------------------------
    serviceApply:
      name: service:apply
      summary: station -> daemon, command. Declare a service's desired state.
      payload: { $ref: "#/components/schemas/ServiceApply" }
    serviceControl:
      name: service:control
      summary: station -> daemon, command. Start, stop or restart a service.
      payload: { $ref: "#/components/schemas/ServiceControl" }
    serviceRemove:
      name: service:remove
      summary: station -> daemon, command. Tear a declared service down.
      payload: { $ref: "#/components/schemas/ServiceRemove" }
    serviceStatus:
      name: service:status
      summary: daemon -> station. Snapshot of one service; latest wins.
      payload: { $ref: "#/components/schemas/ServiceStatus" }

  schemas:
    # =========================================================================
    # Envelope and session
    # =========================================================================
    Envelope:
      type: object
      description: Every frame. The message payload is `data`.
      properties:
        type:
          type: string
          description: Message name, e.g. `execution:dispatch`.
        id:
          type: string
          description: Set on commands only. The receiver answers with one `result` whose replyTo is this id.
        replyTo:
          type: string
          description: Set on `result` and on `log:lines`. The command this answers.
        requires:
          type: array
          items: { type: string }
          description: |
            Features the receiver must have to act on this command. A receiver
            missing any of them answers `unsupported` without acting.
        sentAt:
          type: string
          format: date-time
          description: Sender's clock. Informational.
        data:
          type: object
          description: The payload, per message type. May be absent when empty.
      required: [type]

    Empty:
      type: object
      description: No payload.

    Hello:
      type: object
      properties:
        instanceId:
          type: string
          description: Stable id of this daemon install. Several installs may share one runner token.
        agent: { $ref: "#/components/schemas/AgentInfo" }
        features:
          type: object
          additionalProperties: { $ref: "#/components/schemas/FeatureStatus" }
          description: |
            Optional features this daemon understands, by name, with whether
            each can be used right now. A name that's absent is not understood.
            v1.0 names: exec.shell, exec.container, exec.compose, exec.http,
            exec.config, agent.restart, agent.upgrade. Everything else in
            this spec is baseline and has no feature name.
        labels:
          type: object
          additionalProperties: { type: string }
          description: Operator-set labels (`[daemon] labels`). May be empty.
        maxConcurrent:
          type: integer
          description: Runs this daemon will hold at once. 0 = no local limit.
        tasksHash:
          type: string
          description: Hash of the task catalog the daemon would send in tasks:sync.
        lastSeq:
          type: integer
          format: int64
          description: Highest execution:update seq this install has ever assigned (0 = none).
        executions:
          type: array
          items: { $ref: "#/components/schemas/InventoryEntry" }
          description: |
            Every execution the daemon still owns: accepted and not yet
            running, running, or finished with an update not yet acked. An
            execution the station believes active on this install and absent
            here was lost by the daemon.
      required: [instanceId, agent, features, labels, maxConcurrent, tasksHash, lastSeq, executions]

    AgentInfo:
      type: object
      properties:
        version: { type: string, description: "Daemon version, e.g. 1.10.0." }
        os: { type: string, description: "linux, darwin, windows, ..." }
        arch: { type: string, description: "amd64, arm64, ..." }
        host: { type: string, description: Hostname. }
        name: { type: string, description: "`[daemon] name` display label; empty when unset." }
      required: [version, os, arch, host]

    FeatureStatus:
      type: object
      properties:
        available: { type: boolean }
        reason:
          type: string
          description: Why it's unavailable, for an operator to read.
      required: [available]

    InventoryEntry:
      type: object
      properties:
        executionId: { type: string }
        status: { $ref: "#/components/schemas/ExecutionStatus" }
      required: [executionId, status]

    Welcome:
      type: object
      properties:
        connectionId: { type: string }
        features:
          type: array
          items: { type: string }
          description: Optional features this station understands. Empty in v1.0.
        heartbeat: { $ref: "#/components/schemas/Heartbeat" }
        statsIntervalMs:
          type: integer
          description: How often to send agent:stats. 0 = don't.
        maxFrameBytes:
          type: integer
          description: Largest frame the station accepts. The daemon splits or truncates to stay under it.
        tasksHashKnown:
          type: boolean
          description: False means send tasks:sync now.
      required: [connectionId, features, heartbeat, statsIntervalMs, maxFrameBytes, tasksHashKnown]

    Heartbeat:
      type: object
      properties:
        intervalMs: { type: integer, minimum: 1000 }
        timeoutMs: { type: integer, minimum: 1000 }
      required: [intervalMs, timeoutMs]

    Goodbye:
      type: object
      properties:
        code: { $ref: "#/components/schemas/GoodbyeCode" }
        message: { type: string }
        retry:
          type: boolean
          description: |
            Authoritative. False: don't reconnect until the daemon's station
            settings change (or it restarts). True: reconnect after
            retryAfterMs, plus normal jitter.
        retryAfterMs:
          type: integer
          description: |
            Wait at least this long before reconnecting. For `draining` the
            daemon waits a random time in [0, retryAfterMs] so a fleet spreads out.
      required: [code, retry]

    GoodbyeCode:
      $id: GoodbyeCode
      type: string
      description: Open. Act on `retry`/`retryAfterMs`, not on the code.
      enum:
        - unauthorized
        - revoked
        - disabled
        - limit_reached
        - unsupported_protocol
        - overloaded
        - draining
        - duplicate_instance
        - shutdown
        - protocol_error

    Result:
      type: object
      description: |
        Command-specific result fields sit next to `ok` and `error` in the same
        object (see the *Result schemas).
      properties:
        ok: { type: boolean }
        error: { $ref: "#/components/schemas/ErrorInfo" }
      required: [ok]

    ErrorInfo:
      type: object
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        retryable:
          type: boolean
          description: Authoritative, so a code added later is still handled right.
        retryAfterMs: { type: integer }
      required: [code, message, retryable]

    ErrorCode:
      $id: ErrorCode
      type: string
      description: |
        Open. `invalid` malformed; `unauthorized`; `forbidden` refused by local
        policy; `not_found`; `conflict`; `unsupported` unknown command or
        missing required feature; `unavailable` backend missing; `busy` at
        capacity; `expired` notAfter passed; `internal`.
      enum:
        - invalid
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - unsupported
        - unavailable
        - busy
        - expired
        - internal

    Ack:
      type: object
      properties:
        seq: { type: integer, format: int64 }
      required: [seq]

    SessionUpdate:
      type: object
      description: Any field set replaces the current value.
      properties:
        heartbeat: { $ref: "#/components/schemas/Heartbeat" }
        statsIntervalMs:
          type: integer
          nullable: true
          description: null = leave as is, 0 = stop sending agent:stats.

    # =========================================================================
    # Agent
    # =========================================================================
    AgentUpdate:
      type: object
      description: Fields set replace what hello said.
      properties:
        agent: { $ref: "#/components/schemas/AgentInfo" }
        features:
          type: object
          additionalProperties: { $ref: "#/components/schemas/FeatureStatus" }
        labels:
          type: object
          additionalProperties: { type: string }
        maxConcurrent: { type: integer, nullable: true }

    AgentStats:
      type: object
      properties:
        cpuUsage: { type: number, description: "Percent, 0-100." }
        memUsage: { type: number, description: "Percent, 0-100." }
        memTotalBytes: { type: integer, format: int64 }
        memUsedBytes: { type: integer, format: int64 }
        cpuCores: { type: integer }
        uptimeMs: { type: integer, format: int64, description: Daemon process uptime. }

    AgentUpgrade:
      type: object
      description: |
        Install release `version` from the daemon's own built-in release source
        (never a station-supplied location), verify it, replace the binary and
        restart. The result is sent before the restart. Refused with
        `forbidden` unless the operator allowed it locally.
      properties:
        version: { type: string, description: "Release tag, e.g. v1.10.2." }
      required: [version]

    AgentCredentials:
      type: object
      description: |
        Replace the runner token. The daemon stores it durably before
        answering ok; the station may revoke the old token after that.
      properties:
        token: { type: string }
      required: [token]

    # =========================================================================
    # Tasks
    # =========================================================================
    TasksSync:
      type: object
      properties:
        hash: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskDefinition" }
      required: [hash, tasks]

    TasksSyncResult:
      type: object
      description: Fields of the `result` answering tasks:sync.
      properties:
        added: { type: integer }
        updated: { type: integer }
        removed: { type: integer, description: Tasks marked out of sync. }
        total: { type: integer }

    TaskDefinition:
      type: object
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/TaskKind" }
        group: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        spec: { $ref: "#/components/schemas/ExecutionSpec" }
        timeoutMs: { type: integer }
        options: { $ref: "#/components/schemas/RunOptions" }
        maxConcurrent: { type: integer }
        onOverlap: { $ref: "#/components/schemas/OverlapPolicy" }
        restartPolicy: { type: string, description: "never, on_failure, always." }
        maxRetries: { type: integer }
        retryDelayMs: { type: integer }
        retryBackoff: { $ref: "#/components/schemas/Backoff" }
        schedules:
          type: array
          items: { $ref: "#/components/schemas/TaskSchedule" }
        jitterMs:
          type: integer
          nullable: true
          description: null = not set locally; 0 = explicitly no jitter.
        catchUp: { type: string, description: "skip, latest, all." }
        maxCatchUpRuns: { type: integer }
        params:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TaskParam" }
        service: { $ref: "#/components/schemas/ServiceSettings" }
        compose: { $ref: "#/components/schemas/ComposeRef" }
      required: [name, kind, enabled, spec]

    TaskKind:
      $id: TaskKind
      type: string
      enum: [task, service]

    OverlapPolicy:
      $id: OverlapPolicy
      type: string
      enum: [queue, skip, kill]

    Backoff:
      $id: Backoff
      type: string
      enum: [constant, linear, exponential]

    TaskSchedule:
      type: object
      properties:
        cron: { type: string }
        timezone: { type: string, description: IANA zone. }
        enabled: { type: boolean }
      required: [cron, timezone, enabled]

    TaskParam:
      type: object
      properties:
        kind: { type: string, description: "env, arg, ..." }
        type: { type: string }
        required: { type: boolean }
        default: { type: string, nullable: true }
        choices:
          type: array
          items: { type: string }
        allowCustom: { type: boolean }
        description: { type: string }

    ServiceSettings:
      type: object
      properties:
        instances: { type: integer, minimum: 1 }
        autostart: { type: boolean }
        restartDelayMs: { type: integer }
        restartBackoff: { $ref: "#/components/schemas/Backoff" }
        backoffResetAfterMs: { type: integer }

    ComposeRef:
      type: object
      properties:
        file: { type: string }
        projectName: { type: string }
        service: { type: string }
      required: [file, projectName]

    # =========================================================================
    # Execution specs (the `spec` union, discriminated by `type`)
    # =========================================================================
    ExecutionSpec:
      description: |
        What to run. Discriminated by `type`; type X needs feature `exec.X`,
        so a sender puts `exec.X` in `requires`. Unknown types are refused
        with `unsupported`.
      oneOf:
        - $ref: "#/components/schemas/ShellSpec"
        - $ref: "#/components/schemas/ContainerSpec"
        - $ref: "#/components/schemas/ComposeSpec"
        - $ref: "#/components/schemas/HTTPSpec"
        - $ref: "#/components/schemas/ConfigSpec"

    ShellSpec:
      type: object
      properties:
        type: { type: string, const: shell }
        script: { type: string }
        shell: { type: string, description: "Absolute interpreter path; empty = /bin/sh." }
        workingDir: { type: string }
        umask: { type: string, description: 3 or 4 octal digits. }
        envBase: { type: string, description: "inherit (default) or clean." }
      required: [type, script]

    ContainerSpec:
      type: object
      properties:
        type: { type: string, const: container }
        script: { type: string }
        baseImage: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/DockerfileBlock" }
        env:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
        volumes:
          type: array
          items: { $ref: "#/components/schemas/VolumeMount" }
        ports:
          type: array
          items: { $ref: "#/components/schemas/PortMapping" }
        dockerfile: { type: string, description: Raw Dockerfile; overrides baseImage and blocks. }
      required: [type, script]

    DockerfileBlock:
      type: object
      properties:
        label: { type: string }
        dockerfile: { type: string }
        enabled: { type: boolean }
      required: [label, dockerfile, enabled]

    VolumeMount:
      type: object
      properties:
        host: { type: string }
        container: { type: string }
        readonly: { type: boolean }
      required: [host, container]

    PortMapping:
      type: object
      properties:
        host: { type: integer }
        container: { type: integer }
        protocol: { type: string }
      required: [host, container]

    KeyValue:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
      required: [key, value]

    ComposeSpec:
      type: object
      properties:
        type: { type: string, const: compose }
        file: { type: string }
        projectName: { type: string }
        service: { type: string }
        mode: { type: string, description: "run, stack or exec." }
        profiles:
          type: array
          items: { type: string }
        envFile:
          type: array
          items: { type: string }
        workingDir: { type: string }
        withDeps: { type: boolean }
        pull: { type: string, description: "missing, always or never." }
        servicePorts: { type: boolean }
        command: { type: string }
      required: [type, file, projectName, mode]

    HTTPSpec:
      type: object
      properties:
        type: { type: string, const: http }
        method: { type: string }
        url: { type: string }
        headers:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
        body: { $ref: "#/components/schemas/HTTPBody" }
      required: [type, method, url]

    HTTPBody:
      type: object
      properties:
        kind: { type: string }
        json: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
      required: [kind]

    ConfigSpec:
      type: object
      description: |
        Run the daemon's own task `taskName`. The dispatch's timeoutMs and
        options apply to this run only; an env that differs from the task's
        own needs the task's allow_station_dispatch.
      properties:
        type: { type: string, const: config }
        taskName: { type: string }
      required: [type, taskName]

    # =========================================================================
    # Executions
    # =========================================================================
    RunOptions:
      type: object
      description: Per-run knobs. An unset field means the daemon default (for a config spec, the task's own value).
      properties:
        env:
          type: object
          additionalProperties: { type: string }
        gracefulStopMs: { type: integer, description: SIGTERM to SIGKILL window. }
        logMaxBytes: { type: integer, format: int64 }
        logOnFull: { type: string, description: "drop_new, drop_old or kill." }
        failures:
          type: array
          items: { type: string }
          description: The task's `failures` policy in runwisp.toml syntax. Invalid = refused with `invalid`.

    ExecutionDispatch:
      type: object
      description: |
        Idempotent by executionId: a repeat gets ok again without a second
        run. Rejections: not_found (no such config task), forbidden (local
        policy), unavailable (backend missing), busy (retryable), expired.
      properties:
        executionId: { type: string }
        task: { $ref: "#/components/schemas/TaskRef" }
        attempt: { type: integer }
        priority: { type: integer }
        spec: { $ref: "#/components/schemas/ExecutionSpec" }
        inputs:
          type: object
          additionalProperties: { type: string }
        timeoutMs: { type: integer, description: 0 = no timeout (config spec - the task's own). }
        options: { $ref: "#/components/schemas/RunOptions" }
        logStream:
          type: boolean
          description: Upload the log in chunks while running (upload:request purpose log.chunk).
        notAfter:
          type: string
          format: date-time
          nullable: true
          description: Refuse with `expired` instead of starting after this time.
      required: [executionId, task, spec]

    TaskRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
      required: [id, name]

    ExecutionStop:
      type: object
      properties:
        executionId: { type: string }
        reason: { type: string }
        gracefulStopMs:
          type: integer
          description: Overrides the run's own window. 0 = keep it.
        force: { type: boolean, description: Kill now. }
      required: [executionId]

    ExecutionStatus:
      $id: ExecutionStatus
      type: string
      description: CLOSED. accepted (not started yet), running, finished.
      enum: [accepted, running, finished]

    ExecutionUpdate:
      type: object
      description: |
        A finished execution gets one update with status finished, and,
        after its log archive is uploaded, a second finished update carrying
        `log`. Both are sequenced and acked.

        A service instance's run is an execution the daemon starts itself: its
        executionId is the daemon's run id, and every update of it carries
        taskId and instance, so the station records the run from whichever
        update it sees first.
      properties:
        seq: { type: integer, format: int64 }
        executionId: { type: string }
        taskId:
          type: string
          description: Set on a service instance's run. The service, as in service:status.
        instance:
          type: integer
          nullable: true
          description: Set on a service instance's run. 0-based instance slot.
        status: { $ref: "#/components/schemas/ExecutionStatus" }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        reason:
          type: string
          description: |
            Open. Set when finished: succeeded, failed, stopped, timeout,
            crashed, skipped, log_overflow, queue_full, dst_skipped,
            daemon_stopped, missed, start_failed, unhealthy, ... A receiver
            that doesn't know the value uses isFailure.
        isFailure:
          type: boolean
          nullable: true
          description: Set when finished. Whether the run counts as failed under its failures policy.
        exitCode: { type: integer, nullable: true }
        usage: { $ref: "#/components/schemas/ExecutionUsage" }
        log: { $ref: "#/components/schemas/LogArchive" }
      required: [seq, executionId, status]

    ExecutionUsage:
      type: object
      properties:
        peakMemoryBytes: { type: integer, format: int64, nullable: true }
        cpuTimeMs: { type: integer, format: int64, nullable: true }

    LogArchive:
      type: object
      properties:
        key: { type: string, description: The key of the upload:request target used. }
        bytes: { type: integer, format: int64, description: Gzipped size. }
        chunks:
          type: integer
          nullable: true
          description: Log chunks uploaded (seq 0..chunks-1); null = unknown.
      required: [key, bytes]

    # =========================================================================
    # Logs
    # =========================================================================
    LogSubscribe:
      type: object
      description: |
        Streams log:lines (replyTo = this command's id) from fromLine on, then,
        with follow, live lines with no gap or overlap. Ends with a result
        (LogSubscribeResult): when limit lines were sent, when the run finished
        and all lines were sent, or after log:unsubscribe.
      properties:
        executionId: { type: string }
        fromLine: { type: integer, format: int64, description: "First absolute line; 0 = start; negative = the last -fromLine lines (a tail)." }
        follow: { type: boolean }
        limit: { type: integer, format: int64, description: 0 = no limit. }
      required: [executionId, fromLine, follow]

    LogSubscribeResult:
      type: object
      properties:
        nextLine: { type: integer, format: int64 }
        eof: { type: boolean, description: The run is finished and every line was sent. }

    LogUnsubscribe:
      type: object
      properties:
        subscription: { type: string, description: The log:subscribe command's id. }
      required: [subscription]

    LogLines:
      type: object
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
        gap: { $ref: "#/components/schemas/LogGap" }
      required: [lines]

    LogGap:
      type: object
      description: Lines [from, to) were dropped under backpressure; replay them if needed.
      properties:
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
      required: [from, to]

    LogLine:
      type: object
      properties:
        n: { type: integer, format: int64, description: Absolute line index. }
        ts: { type: integer, format: int64, description: Unix ms; 0 = unknown. }
        stream: { $ref: "#/components/schemas/LogStream" }
        text: { type: string, description: No trailing newline. }
        continued: { type: boolean, description: Continues an oversized split line. }
      required: [n, stream, text]

    LogStream:
      $id: LogStream
      type: string
      enum: [stdout, stderr, system]

    LogSearch:
      type: object
      properties:
        executionId: { type: string }
        query: { type: string }
        regex: { type: boolean, description: RE2. }
        caseSensitive: { type: boolean }
        fromLine: { type: integer, format: int64 }
        limit: { type: integer, format: int64 }
      required: [executionId, query]

    LogSearchResult:
      type: object
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
        nextLine: { type: integer, format: int64 }
        exhausted: { type: boolean }
      required: [hits, exhausted]

    UploadRequest:
      type: object
      properties:
        executionId: { type: string }
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        fromSeq: { type: integer, description: First chunk seq (log.chunk). }
        count: { type: integer, description: Targets wanted (log.chunk). }
      required: [executionId, purpose]

    UploadPurpose:
      $id: UploadPurpose
      type: string
      description: Open; an unknown purpose is answered `unsupported`.
      enum: [log.archive, log.chunk]

    UploadRequestResult:
      type: object
      description: Fewer targets than asked for means a cap was reached; stop chunking.
      properties:
        uploads:
          type: array
          items: { $ref: "#/components/schemas/UploadTarget" }
      required: [uploads]

    UploadTarget:
      type: object
      properties:
        seq: { type: integer }
        url: { type: string }
        method: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Send exactly these headers with the upload.
        key: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [url, method, key]

    # =========================================================================
    # Services
    # =========================================================================
    ServiceApply:
      type: object
      description: |
        Idempotent upsert of a service. Re-sent after reconnect. spec null
        keeps the daemon's own command for a service from its config.
      properties:
        taskId: { type: string }
        taskName: { type: string }
        spec:
          $ref: "#/components/schemas/ExecutionSpec"
          description: null (or absent) keeps the daemon's own command.
        settings: { $ref: "#/components/schemas/ServiceSettings" }
        options: { $ref: "#/components/schemas/RunOptions" }
      required: [taskId, taskName, settings]

    ServiceControl:
      type: object
      properties:
        taskId: { type: string }
        action: { $ref: "#/components/schemas/ServiceAction" }
      required: [taskId, action]

    ServiceAction:
      $id: ServiceAction
      type: string
      enum: [start, stop, restart]

    ServiceRemove:
      type: object
      properties:
        taskId: { type: string }
      required: [taskId]

    ServiceStatus:
      type: object
      description: Sent on change and after welcome. Lives as long as the connection.
      properties:
        taskId: { type: string }
        state: { $ref: "#/components/schemas/ServiceState" }
        desiredInstances: { type: integer }
        runningInstances: { type: integer }
        instances:
          type: array
          items: { $ref: "#/components/schemas/ServiceInstance" }
      required: [taskId, state, desiredInstances, runningInstances, instances]

    ServiceState:
      $id: ServiceState
      type: string
      description: Open. running, degraded, stopped, fatal.
      enum: [running, degraded, stopped, fatal]

    ServiceInstance:
      type: object
      properties:
        index: { type: integer }
        state: { $ref: "#/components/schemas/ServiceInstanceState" }
        pid: { type: integer, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        restartCount: { type: integer, description: "Exits since the last healthy run, operator actions included." }
        startFails: { type: integer, description: Failed starts in a row since the last healthy run. }
        lastExitCode: { type: integer, nullable: true }
        executionId:
          type: string
          description: The slot's current or latest run, as in execution:update. Absent before its first run.
      required: [index, state, restartCount, startFails]

    ServiceInstanceState:
      $id: ServiceInstanceState
      type: string
      description: Open. running, restarting, stopped, fatal.
      enum: [running, restarting, stopped, fatal]
