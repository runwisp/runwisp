asyncapi: 2.6.0
info:
  title: RunWisp Protocol
  version: 2.0.0
  description: WebSocket protocol between RunWisp daemons and the control plane

defaultContentType: application/json

channels:
  cloudToDaemon:
    description: Messages sent from cloud to the daemon
    publish:
      message:
        oneOf:
          - $ref: "#/components/messages/authResult"
          - $ref: "#/components/messages/pong"
          - $ref: "#/components/messages/executionDispatch"
          - $ref: "#/components/messages/executionStop"
          - $ref: "#/components/messages/logReplayRequest"
          - $ref: "#/components/messages/logListen"
          - $ref: "#/components/messages/logStop"
          - $ref: "#/components/messages/errorCloudToDaemon"

  daemonToCloud:
    description: Messages sent from the daemon to cloud
    subscribe:
      message:
        oneOf:
          - $ref: "#/components/messages/ping"
          - $ref: "#/components/messages/executionUpdate"
          - $ref: "#/components/messages/logLine"
          - $ref: "#/components/messages/logReplayChunk"
          - $ref: "#/components/messages/errorDaemonToCloud"

components:
  messages:
    authResult:
      name: auth:result
      payload:
        $ref: "#/components/schemas/AuthResultMessage"

    pong:
      name: pong
      payload:
        $ref: "#/components/schemas/PongMessage"

    executionDispatch:
      name: execution:dispatch
      payload:
        $ref: "#/components/schemas/ExecutionDispatchMessage"

    executionStop:
      name: execution:stop
      payload:
        $ref: "#/components/schemas/ExecutionStopMessage"

    logReplayRequest:
      name: log:replayRequest
      payload:
        $ref: "#/components/schemas/LogReplayRequestMessage"

    logListen:
      name: log:listen
      payload:
        $ref: "#/components/schemas/LogListenMessage"

    logStop:
      name: log:stop
      payload:
        $ref: "#/components/schemas/LogStopMessage"

    errorCloudToDaemon:
      name: error
      payload:
        $ref: "#/components/schemas/ProtocolErrorMessage"

    ping:
      name: ping
      payload:
        $ref: "#/components/schemas/PingMessage"

    executionUpdate:
      name: execution:update
      payload:
        $ref: "#/components/schemas/ExecutionUpdateMessage"

    logLine:
      name: log:line
      payload:
        $ref: "#/components/schemas/LogLineMessage"

    logReplayChunk:
      name: log:replayChunk
      payload:
        $ref: "#/components/schemas/LogReplayChunkMessage"

    errorDaemonToCloud:
      name: error
      payload:
        $ref: "#/components/schemas/DaemonProtocolErrorMessage"

  schemas:
    ExecutionStatus:
      $id: ExecutionStatus
      type: string
      enum:
        - running
        - ok
        - err
        - stopped
        - timeout

    TriggerType:
      $id: TriggerType
      type: string
      enum:
        - manual
        - schedule
        - success
        - failure

    AuthResultMessage:
      type: object
      properties:
        type:
          type: string
          const: auth:result
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        success:
          type: boolean
        connectionId:
          type: string
        error:
          type: string
      required:
        - type
        - success

    PongMessage:
      type: object
      properties:
        type:
          type: string
          const: pong
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
      required:
        - type

    ExecutionDispatchMessage:
      type: object
      description: |
        Dispatches an execution to a daemon.
        For "fan-out" distribution on cluster runners, the control plane sends
        this message to every connected node simultaneously.
      properties:
        type:
          type: string
          const: execution:dispatch
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        execution:
          $ref: "#/components/schemas/ExecutionPayload"
      required:
        - type
        - execution

    ExecutionPayload:
      type: object
      properties:
        id:
          type: string
        taskId:
          type: string
        taskName:
          type: string
        executionId:
          type: string
        priority:
          type: integer
        triggeredBy:
          $ref: "#/components/schemas/TriggerType"
        inputValues:
          type: object
          additionalProperties:
            type: string
        script:
          type: object
        timeout:
          type: integer
        logUploadUrl:
          type: string
          description: |
            Signed PUT URL the daemon uses to upload the gzipped terminal log
            archive. Empty string means archival is disabled for this dispatch
            (transient cloud-side issuance error); the daemon keeps the local
            file and skips upload.
        logPath:
          type: string
          description: |
            S3 object key the daemon must echo back as `logPath` on the
            terminal `execution:update` message after a successful upload.
            Format `{orgId}/{yyyy-mm}/{executionId}.log.gz`. Empty when
            `logUploadUrl` is empty.
      required:
        - id
        - taskId
        - taskName
        - executionId
        - priority
        - triggeredBy
        - inputValues
        - script
        - timeout
        - logUploadUrl
        - logPath

    ExecutionStopMessage:
      type: object
      properties:
        type:
          type: string
          const: execution:stop
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        executionId:
          type: string
        reason:
          type: string
      required:
        - type
        - executionId
        - reason

    LogReplayRequestMessage:
      type: object
      description: |
        Cloud → daemon. Requests a bounded historical page of log lines for an
        execution. The daemon replies with one or more log:replayChunk messages
        whose final flag marks the end of the page.
      properties:
        type:
          type: string
          const: log:replayRequest
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        id:
          type: string
        executionId:
          type: string
        fromLine:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
          minimum: 0
      required:
        - type
        - id
        - executionId
        - fromLine
        - limit

    LogListenMessage:
      type: object
      properties:
        type:
          type: string
          const: log:listen
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        executionId:
          type: string
      required:
        - type
        - executionId

    LogStopMessage:
      type: object
      properties:
        type:
          type: string
          const: log:stop
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        executionId:
          type: string
      required:
        - type
        - executionId

    ProtocolErrorMessage:
      type: object
      properties:
        type:
          type: string
          const: error
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
      required:
        - type
        - code
        - message

    PingMessage:
      type: object
      properties:
        type:
          type: string
          const: ping
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        id:
          type: string
      required:
        - type

    ExecutionUpdateMessage:
      type: object
      properties:
        type:
          type: string
          const: "execution:update"
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        executionId:
          type: string
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        exitCode:
          type: integer
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        logPath:
          type: string
          nullable: true
          description: |
            Echoed S3 object key from `ExecutionPayload.logPath`, set only on
            terminal updates after a successful upload.
        logSize:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: |
            Gzipped byte count of the uploaded archive. Set only on terminal
            updates after a successful upload.
      required:
        - type
        - executionId
        - status

    LogLineEntry:
      type: object
      description: A single log line published or replayed by the daemon.
      properties:
        n:
          type: integer
          format: int64
          description: Absolute, monotonically increasing line index.
        ts:
          type: integer
          format: int64
          description: Unix milliseconds. 0 if unavailable.
        stream:
          type: string
          enum: [stdout, stderr, system]
        text:
          type: string
          description: Line content WITHOUT trailing newline and without on-disk prefix.
        continued:
          type: boolean
          description: True if this segment continues an oversized split line.
      required:
        - n
        - stream
        - text

    LogLineMessage:
      type: object
      description: |
        Daemon → cloud. Pushed live for any execution with an active log:listen
        subscription. Each message carries exactly one absolute-numbered line.
      properties:
        type:
          type: string
          const: log:line
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        executionId:
          type: string
        n:
          type: integer
          format: int64
        ts:
          type: integer
          format: int64
        stream:
          type: string
          enum: [stdout, stderr, system]
        text:
          type: string
        continued:
          type: boolean
      required:
        - type
        - executionId
        - n
        - stream
        - text

    LogReplayChunkMessage:
      type: object
      description: |
        Daemon → cloud. One page of historical log lines in reply to a
        log:replayRequest. A reply may span multiple chunks; final=true marks
        the last chunk.
      properties:
        type:
          type: string
          const: log:replayChunk
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        id:
          type: string
        executionId:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LogLineEntry"
        final:
          type: boolean
      required:
        - type
        - id
        - executionId
        - lines
        - final

    DaemonProtocolErrorMessage:
      type: object
      properties:
        type:
          type: string
          const: error
        v:
          type: integer
        sentAt:
          type: string
          format: date-time
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
      required:
        - type
        - code
        - message
