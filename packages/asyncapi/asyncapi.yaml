# =============================================================================
# RunWisp station protocol v1: COMPATIBILITY CONTRACT. Read before editing.
#
# Daemons ship separately from stations and stay in the field for years. A
# daemon built against v1.0 of this file must keep working against every later
# station, and a later daemon against every v1 station. So v1 only ever grows:
#
#   1. Never remove, rename, retype or repurpose a message, field, feature
#      name, error code or enum value. Deprecate by no longer sending it; keep
#      accepting it.
#   2. Adding an optional field is safe: receivers ignore fields they don't
#      know. A field the receiver MUST honour (a limit, a security setting)
#      belongs to a feature; the sender puts that feature in the envelope's
#      `requires` whenever it sets the field.
#   3. Adding a message type is safe: receivers ignore types they don't know,
#      except that an unknown COMMAND (an envelope with an `id`) is answered
#      with a `result` carrying error code `unsupported`. A sender that depends
#      on a new command checks the peer's features first.
#   4. Enums are open unless marked CLOSED. Receivers tolerate unknown values
#      of an open enum by falling back to the closed field next to it (e.g. an
#      unknown execution `reason` falls back to `isFailure`). CLOSED enums
#      never grow.
#   5. The major version is the WebSocket subprotocol (`runwisp.v1`). There is
#      no version number inside messages. A v2 would be offered next to v1.
#   6. Regenerate Go/TS types from this file; never hand-edit the output.
#
# Pre-freeze: v1 is not frozen yet. Until the maintainers declare the freeze
# (before Station's first public release), rules 1 and 3 do not apply and v1
# may break. Once frozen, the rules above bind as written.
# =============================================================================
asyncapi: 2.6.0
info:
  title: RunWisp station protocol
  version: 1.0.0
  description: |
    WebSocket protocol between a RunWisp daemon and a station. The daemon
    always dials out; nothing dials the daemon.

    ## Transport

    The daemon opens a WebSocket to `/api/v1/runner/ws` with
    `Authorization: Bearer <runner token>` and
    `Sec-WebSocket-Protocol: runwisp.v1`. A station that answers without
    selecting `runwisp.v1` doesn't speak this protocol. Text frames carry one
    JSON message each. Binary frames are reserved and ignored. Both sides
    offer `permessage-deflate` without context takeover; a peer may decline
    it. Frame size limits count decompressed bytes: a station accepts a
    hello up to 1 MiB and later frames up to `welcome.maxFrameBytes`; a
    daemon accepts frames up to 16 MiB. A frame over its receiver's limit
    closes the connection, so the sender drops it instead (a command's result
    that would be too large goes out as an `internal` error).

    ## Envelope

    Every frame is an `Envelope`; the message's payload is its `data`.
    A frame with an `id` is a COMMAND and gets exactly one `result` with
    `replyTo` set to that id (a log subscription first streams `log:lines`
    frames with the same `replyTo`, and a log:search streams
    `log:search:hits` frames, before its `result`). A result's `data` is the
    command's own result (its `...Result` schema; absent when it has none);
    a failed command's result carries `error` instead. Ids are unique per
    sender per connection. The station ends a streaming command early with `cancel`;
    the command still ends with its `result`.

    ## Session

    1. daemon -> `hello` (first frame, nothing else before it)
    2. station -> `welcome`, or `goodbye` and close
    3. daemon resends every unacknowledged `execution:update`, sends
       `service:status` for each service, and `tasks:sync` when
       `welcome.tasksSync` is `full`.

    Either side may send `goodbye` and close at any time. Liveness: the daemon
    sends `ping` every `welcome.heartbeat.intervalMs`; the station answers
    `pong`. A side that hears nothing for `heartbeat.timeoutMs` closes.

    ## Delivery

    `execution:update` carries `seq`, increasing per daemon install and kept
    across restarts. The daemon stores each update before sending it and
    deletes it once the station's `ack` covers its seq. The station acks only
    after applying the update durably. Applying an update is idempotent, so
    resends are harmless.

    ## Conventions

    Durations are integer milliseconds (`...Ms`), sizes integer bytes, times
    integer Unix milliseconds (UTC, no time zone; 0 or absent = unset), ids
    opaque strings up to 128 bytes. Log text is
    valid UTF-8 (invalid bytes become U+FFFD). Arrays are `[]`, never `null`.

defaultContentType: application/json

channels:
  stationToDaemon:
    description: Frames the station sends.
    publish:
      message:
        oneOf:
          - $ref: "#/components/messages/welcome"
          - $ref: "#/components/messages/goodbye"
          - $ref: "#/components/messages/pong"
          - $ref: "#/components/messages/result"
          - $ref: "#/components/messages/ack"
          - $ref: "#/components/messages/executionDispatch"
          - $ref: "#/components/messages/executionStop"
          - $ref: "#/components/messages/cancel"
          - $ref: "#/components/messages/logSubscribe"
          - $ref: "#/components/messages/logSearch"
          - $ref: "#/components/messages/serviceApply"
          - $ref: "#/components/messages/serviceControl"
          - $ref: "#/components/messages/serviceRemove"
          - $ref: "#/components/messages/agentRestart"
          - $ref: "#/components/messages/agentUpgrade"
          - $ref: "#/components/messages/agentCredentials"

  daemonToStation:
    description: Frames the daemon sends.
    subscribe:
      message:
        oneOf:
          - $ref: "#/components/messages/hello"
          - $ref: "#/components/messages/goodbye"
          - $ref: "#/components/messages/ping"
          - $ref: "#/components/messages/result"
          - $ref: "#/components/messages/agentUpdate"
          - $ref: "#/components/messages/agentStats"
          - $ref: "#/components/messages/tasksSync"
          - $ref: "#/components/messages/executionUpdate"
          - $ref: "#/components/messages/logLines"
          - $ref: "#/components/messages/logSearchHits"
          - $ref: "#/components/messages/uploadRequest"
          - $ref: "#/components/messages/serviceStatus"

components:
  messages:
    # --- session -------------------------------------------------------------
    hello:
      name: hello
      summary: daemon -> station. First frame; identity, features, inventory.
      payload: { $ref: "#/components/schemas/Hello" }
    welcome:
      name: welcome
      summary: station -> daemon. Accepts the session and sets its parameters.
      payload: { $ref: "#/components/schemas/Welcome" }
    goodbye:
      name: goodbye
      summary: Either side, just before closing. Says whether and when to come back.
      payload: { $ref: "#/components/schemas/Goodbye" }
    ping:
      name: ping
      summary: daemon -> station. Heartbeat. No data.
      payload: { $ref: "#/components/schemas/Empty" }
    pong:
      name: pong
      summary: station -> daemon. Heartbeat reply. No data.
      payload: { $ref: "#/components/schemas/Empty" }
    result:
      name: result
      summary: The single reply to a command; `replyTo` names it, envelope `error` says it failed.
      payload:
        type: object
        description: The command's own result fields (its `...Result` schema), or absent.
    ack:
      name: ack
      summary: station -> daemon. Every execution:update up to seq is applied.
      payload: { $ref: "#/components/schemas/Ack" }
    cancel:
      name: cancel
      summary: station -> daemon. End the streaming command named in `command` early; it still sends its result.
      payload: { $ref: "#/components/schemas/Cancel" }

    # --- agent ---------------------------------------------------------------
    agentUpdate:
      name: agent:update
      summary: daemon -> station. Identity or features changed mid-session.
      payload: { $ref: "#/components/schemas/AgentUpdate" }
    agentStats:
      name: agent:stats
      summary: daemon -> station. Host snapshot, every welcome.statsIntervalMs.
      payload: { $ref: "#/components/schemas/AgentStats" }
    agentRestart:
      name: agent:restart
      summary: station -> daemon, command. Restart the daemon process. Feature agent.restart.
      payload: { $ref: "#/components/schemas/Empty" }
    agentUpgrade:
      name: agent:upgrade
      summary: station -> daemon, command. Install a release and restart. Feature agent.upgrade.
      payload: { $ref: "#/components/schemas/AgentUpgrade" }
    agentCredentials:
      name: agent:credentials
      summary: station -> daemon, command. Replace the runner token.
      payload: { $ref: "#/components/schemas/AgentCredentials" }

    # --- tasks ---------------------------------------------------------------
    tasksSync:
      name: tasks:sync
      summary: daemon -> station, command. The daemon's whole task catalog.
      payload: { $ref: "#/components/schemas/TasksSync" }

    # --- executions ----------------------------------------------------------
    executionDispatch:
      name: execution:dispatch
      summary: station -> daemon, command. Run one execution. A result without error = accepted.
      payload: { $ref: "#/components/schemas/ExecutionDispatch" }
    executionStop:
      name: execution:stop
      summary: station -> daemon, command. Stop a running execution.
      payload: { $ref: "#/components/schemas/ExecutionStop" }
    executionUpdate:
      name: execution:update
      summary: daemon -> station. Sequenced, stored until acked.
      payload: { $ref: "#/components/schemas/ExecutionUpdate" }

    # --- logs ----------------------------------------------------------------
    logSubscribe:
      name: log:subscribe
      summary: station -> daemon, command. Stream an execution's log lines.
      payload: { $ref: "#/components/schemas/LogSubscribe" }
    logLines:
      name: log:lines
      summary: daemon -> station. Lines for the subscription named in replyTo.
      payload: { $ref: "#/components/schemas/LogLines" }
    logSearch:
      name: log:search
      summary: station -> daemon, command. Search one execution's log, or many.
      payload: { $ref: "#/components/schemas/LogSearch" }
    logSearchHits:
      name: log:search:hits
      summary: daemon -> station. Hits for the log:search named in replyTo.
      payload: { $ref: "#/components/schemas/LogSearchHits" }
    uploadRequest:
      name: upload:request
      summary: daemon -> station, command. Signed upload targets.
      payload: { $ref: "#/components/schemas/UploadRequest" }

    # --- services ------------------------------------------------------------
    serviceApply:
      name: service:apply
      summary: station -> daemon, command. Declare a service's desired state.
      payload: { $ref: "#/components/schemas/ServiceApply" }
    serviceControl:
      name: service:control
      summary: station -> daemon, command. Start, stop or restart a service.
      payload: { $ref: "#/components/schemas/ServiceControl" }
    serviceRemove:
      name: service:remove
      summary: station -> daemon, command. Tear a declared service down.
      payload: { $ref: "#/components/schemas/ServiceRemove" }
    serviceStatus:
      name: service:status
      summary: daemon -> station. Snapshot of one service; latest wins.
      payload: { $ref: "#/components/schemas/ServiceStatus" }

  schemas:
    # =========================================================================
    # Envelope and session
    # =========================================================================
    Envelope:
      type: object
      description: Every frame. The message payload is `data`.
      properties:
        type:
          type: string
          description: Message name, e.g. `execution:dispatch`.
        id:
          type: string
          description: Set on commands only. The receiver answers with one `result` whose replyTo is this id.
        replyTo:
          type: string
          description: Set on `result`, `log:lines` and `log:search:hits`. The command this answers.
        error:
          $ref: "#/components/schemas/ErrorInfo"
          description: Set on a `result` whose command failed; `data` is then absent.
        requires:
          type: array
          items: { type: string }
          description: |
            Features the receiver must have to act on this command. A receiver
            missing any of them answers `unsupported` without acting.
        data:
          type: object
          description: The payload, per message type. May be absent when empty.
      required: [type]

    Empty:
      type: object
      description: No payload.

    Hello:
      type: object
      properties:
        instanceId:
          type: string
          description: Stable id of this daemon install. Several installs may share one runner token.
        agent: { $ref: "#/components/schemas/AgentInfo" }
        features:
          type: object
          additionalProperties: { $ref: "#/components/schemas/FeatureStatus" }
          description: |
            Optional features this daemon understands, by name, with whether
            each can be used right now. A name that's absent is not understood.
            v1.0 names: exec.shell, exec.container, exec.compose, exec.http,
            exec.config, agent.restart, agent.upgrade. Everything else in this
            spec is baseline and has no feature name.
        tasksHash:
          type: string
          description: Hash of the task catalog the daemon would send in tasks:sync.
        executions:
          type: array
          items: { $ref: "#/components/schemas/InventoryEntry" }
          description: |
            Every execution the daemon still owns: accepted and not yet
            running, running, or finished with an update not yet acked. An
            execution the station believes active on this install and absent
            here was lost by the daemon. At most 4096 entries: past that,
            every live one and the oldest finished ones; one left out still
            gets its updates, which settle it.
      required: [instanceId, agent, features, tasksHash, executions]

    AgentInfo:
      type: object
      properties:
        version: { type: string, description: "Daemon version, e.g. 1.10.0." }
        os: { type: string, description: "linux, darwin, windows, ..." }
        arch: { type: string, description: "amd64, arm64, ..." }
        host: { type: string, description: Hostname. }
        name: { type: string, description: "`[daemon] name` display label; empty when unset." }
      required: [version, os, arch, host]

    FeatureStatus:
      type: object
      properties:
        state: { $ref: "#/components/schemas/FeatureState" }
        reason:
          type: string
          description: Why it can't be used, for an operator to read.
      required: [state]

    FeatureState:
      $id: FeatureState
      type: string
      description: |
        Open; any state but available means the feature can't be used now.
        available; disabled (the operator turned it off in the daemon's
        config); unavailable (this host can't provide it, e.g. no Docker).
      enum: [available, disabled, unavailable]

    InventoryEntry:
      type: object
      properties:
        executionId: { type: string }
        status: { $ref: "#/components/schemas/ExecutionStatus" }
      required: [executionId, status]

    Welcome:
      type: object
      properties:
        connectionId: { type: string }
        features:
          type: array
          items: { type: string }
          description: Optional features this station understands. Empty in v1.0.
        heartbeat: { $ref: "#/components/schemas/Heartbeat" }
        statsIntervalMs:
          type: integer
          description: How often to send agent:stats. 0 = don't.
        maxFrameBytes:
          type: integer
          description: Largest frame the station accepts; at least 64 KiB. The daemon batches log lines and search hits to fit, and drops any other frame over it.
        tasksSync: { $ref: "#/components/schemas/TasksSyncMode" }
      required: [connectionId, features, heartbeat, statsIntervalMs, maxFrameBytes, tasksSync]

    TasksSyncMode:
      $id: TasksSyncMode
      type: string
      enum: [none, full]
      description: |
        What the daemon sends of its task catalog after welcome: `none` (the
        station has the catalog hello's tasksHash names) or `full` (send
        tasks:sync now). An unknown value is handled as `full`.

    Heartbeat:
      type: object
      properties:
        intervalMs: { type: integer, minimum: 1000 }
        timeoutMs: { type: integer, minimum: 1000 }
      required: [intervalMs, timeoutMs]

    Goodbye:
      type: object
      properties:
        code: { $ref: "#/components/schemas/GoodbyeCode" }
        message: { type: string }
        retry:
          type: boolean
          description: |
            Authoritative. False: don't reconnect until the daemon's station
            settings change (or it restarts). True: reconnect after
            retryAfterMs, plus normal jitter.
        retryAfterMs:
          type: integer
          description: |
            Wait at least this long before reconnecting. For `draining` the
            daemon waits a random time in [0, retryAfterMs] so a fleet spreads out.
      required: [code, retry]

    GoodbyeCode:
      $id: GoodbyeCode
      type: string
      description: Open. Act on `retry`/`retryAfterMs`, not on the code.
      enum:
        - unauthorized
        - revoked
        - disabled
        - limit_reached
        - unsupported_protocol
        - overloaded
        - draining
        - duplicate_instance
        - shutdown
        - protocol_error

    ErrorInfo:
      type: object
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        retryable:
          type: boolean
          description: Authoritative, so a code added later is still handled right.
      required: [code, message, retryable]

    ErrorCode:
      $id: ErrorCode
      type: string
      description: |
        Open. `invalid` malformed; `unauthorized`; `forbidden` refused by local
        policy; `not_found`; `conflict`; `unsupported` unknown command or
        missing required feature; `unavailable` backend missing; `busy` at
        capacity; `internal`.
      enum:
        - invalid
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - unsupported
        - unavailable
        - busy
        - internal

    Ack:
      type: object
      properties:
        seq: { type: integer, format: int64 }
      required: [seq]

    Cancel:
      type: object
      description: |
        Ends a streaming command (log:subscribe, log:search) early. An id that
        names no running command is ignored.
      properties:
        command: { type: string, description: The id of the command to end. }
      required: [command]

    # =========================================================================
    # Agent
    # =========================================================================
    AgentUpdate:
      type: object
      description: Fields set replace what hello said.
      properties:
        agent: { $ref: "#/components/schemas/AgentInfo" }
        features:
          type: object
          additionalProperties: { $ref: "#/components/schemas/FeatureStatus" }

    AgentStats:
      type: object
      description: |
        Sampled when sent. A value the daemon can't measure on its platform
        is absent, never a stand-in.
      properties:
        host: { $ref: "#/components/schemas/HostStats" }
        daemon: { $ref: "#/components/schemas/DaemonStats" }
      required: [host, daemon]

    HostStats:
      type: object
      description: The machine the daemon runs on.
      properties:
        load1:
          type: number
          nullable: true
          description: 1-minute load average, as the OS reports it (not a percent).
        memTotalBytes: { type: integer, format: int64 }
        memUsedBytes: { type: integer, format: int64, description: Total minus available. }
        cpuCores: { type: integer }

    DaemonStats:
      type: object
      description: The daemon process itself.
      properties:
        uptimeMs: { type: integer, format: int64 }
      required: [uptimeMs]

    AgentUpgrade:
      type: object
      description: |
        Install release `version` from the daemon's own built-in release source
        (never a station-supplied location), verify it, replace the binary and
        restart. The result is sent before the restart. Refused with
        `forbidden` unless the operator allowed it locally.
      properties:
        version: { type: string, description: "Release, e.g. 1.10.2 or v1.10.2." }
      required: [version]

    AgentCredentials:
      type: object
      description: |
        Replace the runner token. The daemon stores it durably before
        answering; the station may revoke the old token after a result
        without error.
      properties:
        token: { type: string }
      required: [token]

    # =========================================================================
    # Tasks
    # =========================================================================
    TasksSync:
      type: object
      properties:
        hash: { type: string, description: Identifies tasks and services together. }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskDefinition" }
          description: The daemon's own tasks and services (runwisp.toml), by name.
        services:
          type: array
          items: { type: string }
          description: |
            The taskId of every service the station declared (service:apply)
            that this daemon still holds. One the station no longer has is
            removed with service:remove.
      required: [hash, tasks, services]

    TasksSyncResult:
      type: object
      description: Fields of the `result` answering tasks:sync.
      properties:
        added: { type: integer }
        updated: { type: integer }
        removed: { type: integer, description: Tasks marked out of sync. }
        total: { type: integer }

    TaskDefinition:
      type: object
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/TaskKind" }
        group: { type: string }
        description: { type: string }
        spec: { $ref: "#/components/schemas/ExecutionSpec" }
        timeoutMs: { type: integer }
        options: { $ref: "#/components/schemas/RunOptions" }
        maxConcurrent: { type: integer }
        onOverlap: { $ref: "#/components/schemas/OverlapPolicy" }
        restartPolicy: { $ref: "#/components/schemas/RestartPolicy" }
        maxRetries: { type: integer }
        retryDelayMs: { type: integer }
        retryBackoff: { $ref: "#/components/schemas/Backoff" }
        schedules:
          type: array
          items: { $ref: "#/components/schemas/TaskSchedule" }
        jitterMs:
          type: integer
          nullable: true
          description: null = not set locally; 0 = explicitly no jitter.
        catchUp: { $ref: "#/components/schemas/CatchUp" }
        maxCatchUpRuns: { type: integer }
        params:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TaskParam" }
        service: { $ref: "#/components/schemas/ServiceSettings" }
        compose: { $ref: "#/components/schemas/ComposeRef" }
      required: [name, kind, spec]

    TaskKind:
      $id: TaskKind
      type: string
      enum: [task, service]

    OverlapPolicy:
      $id: OverlapPolicy
      type: string
      enum: [queue, skip, kill]

    Backoff:
      $id: Backoff
      type: string
      enum: [constant, linear, exponential]

    RestartPolicy:
      $id: RestartPolicy
      type: string
      enum: [never, on_failure, always]

    CatchUp:
      $id: CatchUp
      type: string
      enum: [skip, latest, all]
      description: "Missed schedule ticks run: none, the latest one, or up to maxCatchUpRuns."

    ParamKind:
      $id: ParamKind
      type: string
      enum: [env, arg, option, flag]
      description: How a param reaches the run. A flag is a boolean.

    ParamType:
      $id: ParamType
      type: string
      enum: [string, number]
      description: A value type; a param with choices is an enum of them.

    EnvBase:
      $id: EnvBase
      type: string
      enum: [inherit, clean]
      description: "The env a run starts from: the daemon's own, or crond's minimal set."

    ComposeMode:
      $id: ComposeMode
      type: string
      enum: [run, stack, exec]

    ComposePull:
      $id: ComposePull
      type: string
      enum: [missing, always, never]

    LogOnFull:
      $id: LogOnFull
      type: string
      enum: [drop_new, drop_old, kill]
      description: What a run does when its log reaches logMaxBytes.

    HTTPBodyKind:
      $id: HTTPBodyKind
      type: string
      enum: [none, json, formData]

    TaskSchedule:
      type: object
      properties:
        cron: { type: string }
        timezone: { type: string, description: IANA zone. }
        enabled: { type: boolean }
      required: [cron, timezone, enabled]

    TaskParam:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/ParamKind" }
        type: { $ref: "#/components/schemas/ParamType" }
        required: { type: boolean }
        default: { type: string, nullable: true }
        choices:
          type: array
          items: { type: string }
        allowCustom: { type: boolean }
        description: { type: string }

    ServiceSettings:
      type: object
      properties:
        instances: { type: integer, minimum: 1 }
        autostart: { type: boolean }
        restartDelayMs: { type: integer }
        restartBackoff: { $ref: "#/components/schemas/Backoff" }
        backoffResetAfterMs: { type: integer }

    ComposeRef:
      type: object
      properties:
        file: { type: string }
        projectName: { type: string }
        service: { type: string }
      required: [file, projectName]

    # =========================================================================
    # Execution specs (the `spec` union, discriminated by `type`)
    # =========================================================================
    ExecutionSpec:
      description: |
        What to run. Discriminated by `type`; type X needs feature `exec.X`,
        so a sender puts `exec.X` in `requires`. Unknown types are refused
        with `unsupported`.
      oneOf:
        - $ref: "#/components/schemas/ShellSpec"
        - $ref: "#/components/schemas/ContainerSpec"
        - $ref: "#/components/schemas/ComposeSpec"
        - $ref: "#/components/schemas/HTTPSpec"
        - $ref: "#/components/schemas/ConfigSpec"

    ShellSpec:
      type: object
      properties:
        type: { type: string, const: shell }
        script: { type: string }
        shell: { type: string, description: "Absolute interpreter path; empty = /bin/sh." }
        workingDir: { type: string }
        umask: { type: string, description: 3 or 4 octal digits. }
        envBase: { $ref: "#/components/schemas/EnvBase", description: Default inherit. }
      required: [type, script]

    ContainerSpec:
      type: object
      properties:
        type: { type: string, const: container }
        script: { type: string }
        baseImage: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/DockerfileBlock" }
        env:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
        volumes:
          type: array
          items: { $ref: "#/components/schemas/VolumeMount" }
        ports:
          type: array
          items: { $ref: "#/components/schemas/PortMapping" }
        dockerfile: { type: string, description: Raw Dockerfile; overrides baseImage and blocks. }
      required: [type, script]

    DockerfileBlock:
      type: object
      properties:
        label: { type: string }
        dockerfile: { type: string }
        enabled: { type: boolean }
      required: [label, dockerfile, enabled]

    VolumeMount:
      type: object
      properties:
        host: { type: string }
        container: { type: string }
        readonly: { type: boolean }
      required: [host, container]

    PortMapping:
      type: object
      properties:
        host: { type: integer }
        container: { type: integer }
        protocol: { $ref: "#/components/schemas/PortProtocol" }
      required: [host, container]

    PortProtocol:
      $id: PortProtocol
      type: string
      enum: [tcp, udp, sctp]
      description: Absent = tcp.

    KeyValue:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
      required: [key, value]

    ComposeSpec:
      type: object
      properties:
        type: { type: string, const: compose }
        file: { type: string }
        projectName: { type: string }
        service: { type: string }
        mode: { $ref: "#/components/schemas/ComposeMode" }
        profiles:
          type: array
          items: { type: string }
        envFile:
          type: array
          items: { type: string }
        workingDir: { type: string }
        withDeps: { type: boolean }
        pull: { $ref: "#/components/schemas/ComposePull" }
        servicePorts: { type: boolean }
        command: { type: string }
      required: [type, file, projectName, mode]

    HTTPSpec:
      type: object
      properties:
        type: { type: string, const: http }
        method: { type: string }
        url: { type: string }
        headers:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
        body: { $ref: "#/components/schemas/HTTPBody" }
      required: [type, method, url]

    HTTPBody:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/HTTPBodyKind" }
        json: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/KeyValue" }
      required: [kind]

    ConfigSpec:
      type: object
      description: |
        Run the daemon's own task `taskName`. The dispatch's timeoutMs and
        options apply to this run only; an env that differs from the task's
        own needs the task's RUNWISP_ALLOW=station-dispatch.
      properties:
        type: { type: string, const: config }
        taskName: { type: string }
      required: [type, taskName]

    # =========================================================================
    # Executions
    # =========================================================================
    RunOptions:
      type: object
      description: Per-run knobs. An unset field means the daemon default (for a config spec, the task's own value).
      properties:
        env:
          type: object
          additionalProperties: { type: string }
        gracefulStopMs: { type: integer, description: SIGTERM to SIGKILL window. }
        logMaxBytes: { type: integer, format: int64 }
        logOnFull: { $ref: "#/components/schemas/LogOnFull" }
        failures:
          type: array
          items: { type: string }
          description: The task's `failures` policy in runwisp.toml syntax. Invalid = refused with `invalid`.

    ExecutionDispatch:
      type: object
      description: |
        Idempotent by executionId: a repeat succeeds again without a second
        run. Rejections: not_found (no such config task), forbidden (local
        policy), unavailable (backend missing), busy (retryable).
      properties:
        executionId: { type: string }
        taskId: { type: string, description: The station's task this runs. }
        spec: { $ref: "#/components/schemas/ExecutionSpec" }
        inputs:
          type: object
          additionalProperties: { type: string }
        timeoutMs: { type: integer, description: 0 = no timeout (config spec - the task's own). }
        options: { $ref: "#/components/schemas/RunOptions" }
        logUpload: { $ref: "#/components/schemas/LogUpload" }
      required: [executionId, taskId, spec, logUpload]

    LogUpload:
      $id: LogUpload
      type: string
      description: |
        Open; an unknown value is treated as archive. What the daemon uploads
        of a run's log: none (it stays on the daemon, read through log:subscribe
        and log:search), archive (one log.archive upload when the run ends),
        stream (as archive, plus log.chunk uploads while it runs).
      enum: [none, archive, stream]

    ExecutionStop:
      type: object
      description: |
        Stops a running execution, or one accepted and still waiting to start;
        either finishes with reason stopped. Stopping a finished execution
        succeeds; one the daemon never had is refused with not_found.
      properties:
        executionId: { type: string }
      required: [executionId]

    ExecutionStatus:
      $id: ExecutionStatus
      type: string
      description: CLOSED. accepted (not started yet), running, finished.
      enum: [accepted, running, finished]

    ExecutionUpdate:
      type: object
      description: |
        A finished execution gets one update with status finished, and,
        after its log archive is uploaded, a second finished update carrying
        `log`. Both are sequenced and acked.

        A service instance's run is an execution the daemon starts itself: its
        executionId is the daemon's run id, and every update of it carries
        taskId and instance, so the station records the run from whichever
        update it sees first.
      properties:
        seq: { type: integer, format: int64 }
        executionId: { type: string }
        taskId:
          type: string
          description: Set on a service instance's run. The service, as in service:status.taskId.
        instance:
          type: integer
          nullable: true
          description: Set on a service instance's run. 0-based instance slot.
        status:
          $ref: "#/components/schemas/ExecutionStatus"
          description: running or finished. A dispatch's result is its acceptance; accepted appears only in hello's inventory.
        startedAt: { type: integer, format: int64, description: Unix ms. }
        finishedAt: { type: integer, format: int64, description: Unix ms. }
        reason:
          $ref: "#/components/schemas/EndReason"
          description: Set when finished.
        isFailure:
          type: boolean
          nullable: true
          description: Set when finished. Whether the run counts as failed under its failures policy.
        exitCode: { type: integer, nullable: true }
        usage: { $ref: "#/components/schemas/ExecutionUsage" }
        log: { $ref: "#/components/schemas/LogArchive" }
      required: [seq, executionId, status]

    EndReason:
      $id: EndReason
      type: string
      description: Open. Why a run finished; a receiver that doesn't know the value uses isFailure.
      enum:
        - succeeded
        - failed
        - stopped
        - timeout
        - crashed
        - skipped
        - log_overflow
        - queue_full
        - dst_skipped
        - daemon_stopped
        - missed
        - start_failed
        - unhealthy

    ExecutionUsage:
      type: object
      properties:
        peakMemoryBytes: { type: integer, format: int64, nullable: true }
        cpuTimeMs: { type: integer, format: int64, nullable: true }

    LogArchive:
      type: object
      properties:
        key: { type: string, description: The key of the upload:request target used. }
        bytes: { type: integer, format: int64, description: Gzipped size. }
        chunks:
          type: integer
          nullable: true
          description: Log chunks uploaded (seq 0..chunks-1); null = unknown.
      required: [key, bytes]

    # =========================================================================
    # Logs
    # =========================================================================
    LogSubscribe:
      type: object
      description: |
        Streams log:lines (replyTo = this command's id) from fromLine on, then,
        with follow, live lines with no gap or overlap. Ends with a result
        (LogSubscribeResult): when limit lines were sent, when the run finished
        and all lines were sent, without follow once it caught up, or after
        `cancel`. A log the daemon can't read ends it with an `internal` error.
      properties:
        executionId: { type: string }
        fromLine: { type: integer, format: int64, description: "First absolute line; 0 = start; negative = the last -fromLine lines (a tail)." }
        follow: { type: boolean }
        limit: { type: integer, format: int64, description: 0 = no limit. }
      required: [executionId, fromLine, follow]

    LogSubscribeResult:
      type: object
      properties:
        nextLine: { type: integer, format: int64 }
        stopped: { $ref: "#/components/schemas/LogSubscribeStop" }
      required: [nextLine, stopped]

    LogSubscribeStop:
      $id: LogSubscribeStop
      type: string
      description: |
        Open. Why a log:subscribe ended: done (the run finished and every line
        was sent), caught_up (no follow: every line written so far was sent;
        the run goes on), limit, cancelled. Only done means there is nothing
        more to read.
      enum: [done, caught_up, limit, cancelled]

    LogLines:
      type: object
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
        gap: { $ref: "#/components/schemas/LogGap" }
      required: [lines]

    LogGap:
      type: object
      description: Lines [from, to) were dropped under backpressure; replay them if needed.
      properties:
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
      required: [from, to]

    LogLine:
      type: object
      properties:
        n: { type: integer, format: int64, description: Absolute line index. }
        ts: { type: integer, format: int64, description: Unix ms; 0 = unknown. }
        stream: { $ref: "#/components/schemas/LogStream" }
        text: { type: string, description: No trailing newline. }
        continued: { type: boolean, description: Continues an oversized split line. }
      required: [n, stream, text]

    LogStream:
      $id: LogStream
      type: string
      enum: [stdout, stderr, system]

    LogSearch:
      type: object
      description: |
        Searches the local logs of the daemon's station executions, dispatched
        or service instances' runs: with executionId that run alone, else
        every run tasks, since and until select, newest first, one run at a
        time. Hits stream as log:search:hits (replyTo = this command's id); a
        LogSearchResult ends it once every run is scanned, a cap or timeoutMs
        is reached, or after `cancel`. With executionId, an unknown execution
        is refused with not_found and one not started yet with unavailable.
      properties:
        terms:
          type: array
          items: { $ref: "#/components/schemas/LogSearchTerm" }
          description: |
            A line matches when it matches every term. Compiled by the station
            from the user's query. Exactly one of terms and regex is set; a
            search with both or neither is refused as `invalid`.
        regex:
          type: string
          description: RE2. A line matches when it matches regex.
        caseSensitive:
          type: boolean
          description: |
            False: terms and regex ignore case (terms' parts and the line are
            both lowercased, as Go's strings.ToLower does).
        executionId:
          type: string
          description: Search only this execution's log; tasks, since and until are ignored.
        fromLine:
          type: integer
          format: int64
          description: With executionId, start at this absolute line, to resume where nextLine left off.
        tasks:
          type: array
          items: { type: string }
          description: |
            Tasks to search; empty = all. An entry is a taskId as sent in
            execution:dispatch or service:apply, or a task name of the
            daemon's own (the taskName of a config spec, or a service run's
            taskId in execution:update).
        since: { type: integer, format: int64, description: "Unix ms; only runs that overlap [since, until]: still running, or ended at or after since. 0 = no bound." }
        until: { type: integer, format: int64, description: "Unix ms; only runs that overlap [since, until]: started at or before until. 0 = no bound." }
        context: { type: integer, description: "Lines before and after each hit, 0-5." }
        maxHits: { type: integer, minimum: 1, description: Stop after this many hits. }
        maxBytes: { type: integer, description: "Stop after this many bytes of hit text (lines and context). 0 = no limit." }
        timeoutMs: { type: integer, minimum: 1, description: The daemon stops on its own after this long. }
      required: [maxHits, timeoutMs]

    LogSearchTerm:
      type: object
      description: |
        One term: its literal parts in order, separated by `*` (any run of
        characters on the line, including none). A word character is a
        Unicode letter or digit; everything else separates words.
      properties:
        parts:
          type: array
          items: { type: string }
          description: Non-empty literal pieces between the wildcards, in order.
        start: { $ref: "#/components/schemas/TermAnchor", description: Where the first part must begin. }
        end: { $ref: "#/components/schemas/TermAnchor", description: Where the last part must end. }
      required: [parts, start, end]

    TermAnchor:
      $id: TermAnchor
      type: string
      enum: [any, word]
      description: |
        Where a term's edge may sit: `any` position, or a `word` boundary.
        A search with an anchor the daemon doesn't know is refused as
        `invalid`.

    LogSearchHits:
      type: object
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/LogSearchHit" }
        progress: { $ref: "#/components/schemas/LogSearchProgress" }
      required: [hits, progress]

    LogSearchHit:
      type: object
      description: A matching line and its context. Each line's text is cut to 4 KiB, with continued set.
      properties:
        executionId: { type: string }
        line: { $ref: "#/components/schemas/LogLine" }
        before:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
        after:
          type: array
          items: { $ref: "#/components/schemas/LogLine" }
      required: [executionId, line]

    LogSearchProgress:
      type: object
      properties:
        runsScanned: { type: integer }
        runsTotal: { type: integer }
        bytesScanned: { type: integer, format: int64 }
      required: [runsScanned, runsTotal, bytesScanned]

    LogSearchResult:
      type: object
      description: Fields of the `result` answering log:search.
      properties:
        progress: { $ref: "#/components/schemas/LogSearchProgress" }
        stopped: { $ref: "#/components/schemas/LogSearchStop" }
        nextLine:
          type: integer
          format: int64
          description: With executionId, when the search stopped before the log's end, the line after the last hit sent. 0 = nothing left.
      required: [progress, stopped]

    LogSearchStop:
      $id: LogSearchStop
      type: string
      description: Open. Why a log:search ended.
      enum: [done, max_hits, max_bytes, timeout, cancelled]

    UploadRequest:
      type: object
      properties:
        executionId: { type: string }
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        fromSeq: { type: integer, description: First chunk seq (log.chunk). }
        count: { type: integer, description: Targets wanted (log.chunk). }
      required: [executionId, purpose]

    UploadPurpose:
      $id: UploadPurpose
      type: string
      description: Open; an unknown purpose is answered `unsupported`.
      enum: [log.archive, log.chunk]

    UploadRequestResult:
      type: object
      description: Fewer targets than asked for means a cap was reached; stop chunking.
      properties:
        uploads:
          type: array
          items: { $ref: "#/components/schemas/UploadTarget" }
      required: [uploads]

    UploadTarget:
      type: object
      properties:
        seq: { type: integer }
        url: { type: string }
        method: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Send exactly these headers with the upload.
        key: { type: string }
      required: [url, method, key]

    # =========================================================================
    # Services
    # =========================================================================
    ServiceApply:
      type: object
      description: |
        Idempotent upsert of a service. Re-sent after reconnect. spec null
        keeps the daemon's own command for a service from its config.
      properties:
        taskId:
          type: string
          description: The station's task, or the name of a service the daemon defines itself.
        spec:
          $ref: "#/components/schemas/ExecutionSpec"
          description: null (or absent) keeps the daemon's own command.
        settings: { $ref: "#/components/schemas/ServiceSettings" }
        options: { $ref: "#/components/schemas/RunOptions" }
      required: [taskId, settings]

    ServiceControl:
      type: object
      properties:
        taskId: { type: string }
        action: { $ref: "#/components/schemas/ServiceAction" }
      required: [taskId, action]

    ServiceAction:
      $id: ServiceAction
      type: string
      description: Open; an unknown action is refused with `unsupported`.
      enum: [start, stop, restart]

    ServiceRemove:
      type: object
      description: |
        Removes a service the station declared; a taskId the daemon doesn't
        hold succeeds. A service from the daemon's own config is refused with
        `forbidden`.
      properties:
        taskId: { type: string }
      required: [taskId]

    ServiceStatus:
      type: object
      description: |
        Sent on change and after welcome. Lives as long as the connection. A
        service the daemon no longer has (removed, or dropped from its config)
        gets one last status with state removed and no instances; the station
        forgets it.
      properties:
        taskId:
          type: string
          description: The taskId of service:apply for a service the station declared, else the daemon's own task name.
        state: { $ref: "#/components/schemas/ServiceState" }
        instances:
          type: array
          items: { $ref: "#/components/schemas/ServiceInstance" }
          description: One per desired instance, by index.
      required: [taskId, state, instances]

    ServiceState:
      $id: ServiceState
      type: string
      description: Open. running, degraded, stopped, fatal, removed (the service is gone).
      enum: [running, degraded, stopped, fatal, removed]

    ServiceInstance:
      type: object
      properties:
        index: { type: integer }
        state: { $ref: "#/components/schemas/ServiceInstanceState" }
        pid: { type: integer, nullable: true }
        startedAt: { type: integer, format: int64, description: Unix ms. }
        restartCount: { type: integer, description: "Exits since the last healthy run, operator actions included." }
        startFails: { type: integer, description: Failed starts in a row since the last healthy run. }
        lastExitCode: { type: integer, nullable: true }
        executionId:
          type: string
          description: The slot's current or latest run, as in execution:update. Absent before its first run.
      required: [index, state, restartCount, startFails]

    ServiceInstanceState:
      $id: ServiceInstanceState
      type: string
      description: Open. running, restarting, stopped, fatal.
      enum: [running, restarting, stopped, fatal]
