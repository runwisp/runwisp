# RunWisp — example configuration.
#
# Every task needs a name (the table key) and a `run` command. Everything
# else has sensible defaults — add a key only when you want to change it.

[storage]
max_size       = "5gb"
min_free_space = "500mb"

# Cron expressions are evaluated in this timezone unless a [tasks.*] entry
# overrides it with its own timezone =. The daemon refuses to start when a
# cron task has neither a per-task timezone nor a [scheduler] timezone, so
# "0 2 * * *" is never silently bound to a timezone the operator didn't pick.
# UTC is DST-free and a safe baseline; pick a local IANA zone if 2 AM should
# follow your wall clock.
[scheduler]
timezone = "UTC"

[defaults]
timeout      = "1h"
# log_max_size: positive size = cap; "unlimited" = no cap; omit = inherit
# the built-in 100MB. Bare 0 / "0" / "0mb" are rejected at config load.
log_max_size = "100mb"
log_on_full  = "drop_old"
# keep_runs: positive integer = cap; "unlimited" = no cap; omit = inherit.
# Bare 0 and negative integers are rejected — use the keyword.
keep_runs    = 50
# keep_for: positive duration (d/w/h/m) = cap; "unlimited" = no cap;
# omit = inherit. Empty "" and zero/negative durations are rejected.
keep_for     = "30d"


[tasks.network-heartbeat]
group       = "Monitoring"
description = "Pings external services every minute"
cron        = "* * * * *"
on_overlap  = "skip"
keep_runs   = 100
run = """
set -eu
echo "[$(date -Iseconds)] Starting health checks..."
curl -s -o /dev/null -w "Cloudflare latency: %{time_total}s\n" https://1.1.1.1
curl -s -o /dev/null -w "Google latency: %{time_total}s\n" https://8.8.8.8
echo "[$(date -Iseconds)] Health checks completed successfully."
"""


[tasks.nightly-db-backup]
group       = "Infrastructure"
description = "Simulates a database dump, compression, and upload"
cron        = "30 2 * * *"
# Pin this task to America/New_York so the 02:30 wake-up follows the
# operator's local clock even though the daemon defaults to UTC.
timezone    = "America/New_York"
timeout     = "30m"
on_overlap  = "skip"
keep_for    = "14d"
# A two-week outage on a daily backup is "run the missed days, but cap so
# weeks of backlog don't bury the queue". 0 (omit) inherits the 100-run
# default; -1 backfills every missed tick; positive N caps at N.
catch_up          = "all"
max_catch_up_runs = 14
run = """
set -eu
tables=("users" "transactions" "audit_logs" "sessions" "metadata")
echo "[$(date)] Initiating database backup sequence..."
for table in "${tables[@]}"; do
  echo "[$(date)] Exporting table: $table..."
  sleep $((RANDOM % 7 + 2))
  rows=$((RANDOM % 50000 + 10000))
  echo "  -> Exported $rows rows from $table."
done
echo "[$(date)] Compressing archive..."
sleep 12
echo "[$(date)] Upload complete."
"""


[tasks.process-event-queue]
description    = "Worker that retries with exponential backoff"
cron           = "*/10 * * * *"
retry_attempts = 3
retry_delay    = "2s"
retry_backoff  = "exponential"
run = """
echo "Starting queue processing..."
jobs=$((RANDOM % 5 + 1))
echo "Found $jobs jobs in the queue."
for ((i=1; i<=jobs; i++)); do
  echo "Processing job $i..."
  sleep $((RANDOM % 3 + 1))
  if [ $((RANDOM % 100)) -lt 30 ]; then
    >&2 echo "CRITICAL: Database connection lost while processing job $i!"
    exit 1
  fi
  echo "Job $i processed successfully."
done
echo "Queue drained gracefully."
"""


[tasks.log-stress-test]
description  = "Generates a lot of output to exercise log overflow behavior"
log_max_size = "20mb"
log_on_full  = "kill_task"
run = """
echo "WARNING: Starting log tsunami..."
dd if=/dev/urandom bs=1M count=50 2>/dev/null | base64
"""


[services.metrics-collector]
description = "Long-running metrics collector, supervised with exponential restart backoff"
run = """
trap 'echo "SIGTERM received — shutting down gracefully."; exit 0' TERM INT
iteration=0
while true; do
  iteration=$((iteration + 1))
  uptime_s=$(awk '{print int($1)}' /proc/uptime 2>/dev/null || echo "N/A")
  mem_free=$(awk '/MemAvailable/ {printf "%.0f MB", $2/1024}' /proc/meminfo 2>/dev/null || echo "N/A")
  load=$(cut -d' ' -f1-3 /proc/loadavg 2>/dev/null || echo "N/A")
  echo "[$(date -Iseconds)] tick=$iteration uptime=${uptime_s}s mem_free=${mem_free} load=${load}"
  sleep 30 &
  wait $!
done
"""


[services.api-worker]
description = "Three always-on workers consuming the same job queue"
instances   = 3
run = """
trap 'echo "SIGTERM received — draining and exiting."; exit 0' TERM INT
echo "[$(date -Iseconds)] worker starting up..."
while true; do
  job=$((RANDOM % 10))
  echo "[$(date -Iseconds)] processing job #$job"
  sleep $((RANDOM % 5 + 2))
done
"""


# -----------------------------------------------------------------------------
# Notifications (optional)
#
# In-app notifications are on by default — every failed, timed-out, or crashed
# run lights up the bell in the Web UI and the footer line in the TUI, with
# zero config required. Override the default fan-out with [notify]
# default_notifiers — set it to [] to silence the in-app safety net, or to
# ["slack-ops"] to make every failure page Slack instead of (or in addition
# to) the in-app channel.
#
# Notifiers describe optional outbound channels (Slack, Telegram). Routes pick
# which notifiers fire for which events. Per-task sugar (notify_on_failure /
# notify_on_success) desugars to synthetic routes at config-load time.
#
# Secrets follow env > file > inline precedence; supplying more than one is
# an error.
# -----------------------------------------------------------------------------

# [[notifier]]
# id              = "slack-ops"
# type            = "slack"
# webhook_url_env = "RUNWISP_SLACK_OPS_URL"
# channel         = "#ops"    # optional: override the webhook's default channel
# # Or:
# # webhook_url_file = "secrets/slack-ops.url"   # path relative to data dir
# # webhook_url      = "https://hooks.slack.com/services/..."

# [[notifier]]
# id            = "tg-oncall"
# type          = "telegram"
# bot_token_env = "RUNWISP_TG_TOKEN"
# chat_id       = "-1001234567890"
# parse_mode    = "HTML"
# # parse_mode = "MarkdownV2" requires a custom template_path — the embedded
# # default uses HTML and would otherwise render literal tags.
# # template_path = "templates/telegram.tmpl"

# [[notification_route]]
# match  = { kind = ["run.failed", "run.timeout", "run.crashed"], task = "backup-*" }
# notify = ["slack-ops", "tg-oncall", "inapp"]

# [[notification_route]]
# match  = { kind = ["notify.delivery_failed"] }
# notify = ["inapp"]

# [notify]
# default_notifiers = ["inapp"]   # zero-config safety net; set [] to disable
# queue_size        = 1024
# default_timeout   = "10s"   # shrinks the retry budget — delivery failures surface faster
# history_keep      = 500
# history_keep_for  = "30d"
# coalesce_window   = "1h"
# occurrence_ring   = 10
# coalesce_outbound = true    # default; set false to page on every single outbound event

# Per-task sugar: implies a synthetic route with the listed notifiers plus
# whatever is in default_notifiers (deduped). Mirrors notify_on_success.
#
# [tasks.nightly-db-backup]
# notify_on_failure = ["slack-ops"]
#
# Each entry can be a bare notifier id ("slack-ops"), the literal "inapp",
# or "<id>:<target>" — an inline target override. Slack tokens override the
# channel ("slack-ops:#alerts"); telegram tokens override the chat_id
# ("tg-oncall:-1009998887"). Credentials still come from the parent
# [[notifier]] block; the override only changes where messages are routed.
#
# [tasks.weekly-deploy]
# notify_on_failure = ["slack-ops:#deploys"]    # parent slack-ops, channel #deploys

