{{- /* SMTP notification — HTML body. Inline CSS only so MUAs that strip <style> still render. The channel auto-derives a plain-text alternative; keep this layout readable in raw HTML form. Colours are @runwisp/ui theme-tokens.css light values (surface, raised, outline, on-surface/-muted/-faint, surface-sunken, primary-hover for the AA-safe button); mail clients need literals. */ -}}
{{- $tail := "" }}{{ if or (eq .Kind "run.failed") (eq .Kind "run.timeout") }}{{ $tail = outputTail . }}{{ end -}}
{{- $url := "" }}{{ if eq .Kind "log.disk_pressure" }}{{ $url = taskURL .TaskName }}{{ else }}{{ $url = runURL .Run }}{{ end -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ htmlEsc .TaskName }} {{ statusVerb .Kind }}</title>
</head>
<body style="margin:0;padding:24px;background:#f3f6f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#14262a;">
<div style="max-width:600px;margin:0 auto;background:#ffffff;border:1px solid #e0e7e7;border-radius:4px;padding:24px;">
<h2 style="margin:0 0 12px 0;font-size:20px;line-height:1.3;color:#14262a;">{{ statusEmoji .Kind }} {{ htmlEsc .TaskName }} {{ statusVerb .Kind }}</h2>
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.45;color:#14262a;">{{ htmlEsc (eventSentence .) }}</p>
<p style="margin:0 0 16px 0;font-size:13px;line-height:1.45;color:#5a6d70;">{{ htmlEsc (eventTrigger .) }} · {{ humanTime .Timestamp }}.</p>
{{- if $tail }}
<pre style="margin:0 0 16px 0;padding:12px 14px;background:#e9eeee;border-radius:3px;border:1px solid #e0e7e7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;color:#14262a;white-space:pre-wrap;word-break:break-word;">{{ htmlEsc $tail }}</pre>
{{- end }}
{{- if $url }}
<p style="margin:0 0 16px 0;"><a href="{{ $url }}" style="display:inline-block;padding:9px 14px;background:#0e7c86;color:#ffffff;text-decoration:none;border-radius:3px;font-size:14px;font-weight:600;">{{ linkLabel .Kind }}</a></p>
{{- end }}
<p style="margin:16px 0 0 0;padding-top:16px;border-top:1px solid #e0e7e7;font-size:12px;line-height:1.45;color:#869798;font-style:italic;">from runwisp{{ with fingerprint }} · {{ htmlEsc . }}{{ end }}</p>
</div>
</body>
</html>
