{{- /* SMTP notification — HTML body. Inline CSS only so MUAs that strip <style> still render. The channel auto-derives a plain-text alternative; keep this layout readable in raw HTML form. */ -}}
{{- $tail := "" }}{{ if or (eq .Kind "run.failed") (eq .Kind "run.timeout") }}{{ $tail = outputTail .Run }}{{ end -}}
{{- $url := "" }}{{ if eq .Kind "log.disk_pressure" }}{{ $url = taskURL .TaskName }}{{ else }}{{ $url = runURL .Run }}{{ end -}}
<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#111;">
<div style="max-width:600px;margin:0 auto;background:#ffffff;border:1px solid #e3e6ea;border-radius:8px;padding:24px;">
<h2 style="margin:0 0 12px 0;font-size:20px;line-height:1.3;color:#111;">{{ statusEmoji .Kind }} {{ htmlEsc .TaskName }} {{ statusVerb .Kind }}</h2>
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.45;color:#1f2329;">{{ htmlEsc (eventSentence .) }}</p>
<p style="margin:0 0 16px 0;font-size:13px;line-height:1.45;color:#5b6370;">{{ htmlEsc (eventTrigger .) }} · {{ humanTime .Timestamp }}.</p>
{{- if $tail }}
<pre style="margin:0 0 16px 0;padding:12px 14px;background:#f1f3f5;border-radius:6px;border:1px solid #e3e6ea;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;color:#1f2329;white-space:pre-wrap;word-break:break-word;">{{ htmlEsc $tail }}</pre>
{{- end }}
{{- if $url }}
<p style="margin:0 0 16px 0;"><a href="{{ $url }}" style="display:inline-block;padding:9px 14px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:600;">{{ linkLabel .Kind }}</a></p>
{{- end }}
<p style="margin:16px 0 0 0;padding-top:16px;border-top:1px solid #e3e6ea;font-size:12px;line-height:1.45;color:#7b8290;font-style:italic;">from runwisp{{ with fingerprint }} · {{ htmlEsc . }}{{ end }}</p>
</div>
</body>
</html>
