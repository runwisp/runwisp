# Generated by `runwisp import`. Review the notes below, then
# validate with `runwisp validate`.

[tasks.report]
cron = "0 0 6 * * *"
compose_file = "/srv/shop/compose.yml"
compose_service = "app"
run = "php artisan report:daily"

[tasks.schedule]
cron = "@every 1m"
compose_file = "/srv/shop/compose.yml"
compose_service = "app"
run = "php artisan schedule:run"
on_overlap = "skip"

[tasks.cleanup]
cron = "@weekly"
run = "docker run --rm --init -v /srv/cache:/tmp/cache alpine rm -rf /tmp/cache"
