# Generated by `runwisp import`. Review the notes below, then
# validate with `runwisp validate`.

[tasks.app-schedule]
cron = "@every 1m"
run = "docker exec -u www-data -e APP_ENV -e LOG_LEVEL shop-app-1 php artisan schedule:run"
on_overlap = "skip"

[tasks.app-schedule.env]
APP_ENV = "production"
LOG_LEVEL = "info"

[tasks.nightly-backup]
cron = "0 0 3 * * *"
run = "docker run --rm --init --network shop_default -v /srv/shop/dumps:/dumps -e PGPASSWORD postgres:17 pg_dump -h db -U shop -f /dumps/shop.sql shop"

[tasks.nightly-backup.env]
PGPASSWORD = "secret"

[tasks.prune-logs]
cron = "@daily"
run = "find /var/log/app -mtime +14 -delete"
working_dir = "/var/log"
