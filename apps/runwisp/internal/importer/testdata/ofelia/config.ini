[global]
slack-webhook = https://hooks.slack.com/services/T000/B000/XXXX
save-folder = /var/log/ofelia

[job-exec "app-schedule"]
schedule = @every 1m
container = shop-app-1
command = php artisan schedule:run
user = www-data
environment = APP_ENV=production
environment = LOG_LEVEL=info
no-overlap = true

[job-run "nightly-backup"]
schedule = 0 0 3 * * *
image = postgres:17
command = pg_dump -h db -U shop -f /dumps/shop.sql shop
network = shop_default
volume = /srv/shop/dumps:/dumps
environment = PGPASSWORD=secret
tty = true

[job-local "prune-logs"]
schedule = @daily
command = find /var/log/app -mtime +14 -delete
dir = /var/log

[job-service-run "swarm-task"]
schedule = @hourly
image = alpine
command = true
