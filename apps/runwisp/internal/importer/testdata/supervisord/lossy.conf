; A program that exercises the quiet drops: a key with no RunWisp equivalent, a
; value RunWisp can't read, and cosmetic keys that must stay silent.
[program:web]
command=/usr/bin/web --serve
process_name=%(program_name)s_%(process_num)02d
stderr_events_enabled=true
numprocs_start=1
stopwaitsecs=soon
