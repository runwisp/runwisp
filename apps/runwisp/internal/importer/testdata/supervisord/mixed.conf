; A mix of program kinds: a group, an always-on service, a run-once task
; (autorestart=false), and an eventlistener RunWisp can't represent.

[group:site]
programs=api,batch

[program:api]
command=/srv/api/bin/serve --port 8080
autorestart=unexpected
directory=/srv/api

[program:batch]
command=/srv/api/bin/migrate
autostart=true
autorestart=false

[eventlistener:memmon]
command=memmon -a 200MB
events=TICK_60
