# Generated by `runwisp import`. Review the notes below, then
# validate with `runwisp validate`.

[services.web]
run = "/usr/bin/gunicorn --workers 4 app:app"
working_dir = "/srv/app"
user = "www-data"
autostart = true
healthy_after = "10s"
restart_attempts = 3
stop_signal = "SIGINT"
graceful_stop = "30s"

[services.web.env]
DJANGO_SETTINGS = "app.settings.prod"
LOG_LEVEL = "info"

[services.worker]
run = "/usr/local/bin/celery worker -A app --concurrency=2"
working_dir = "/srv/app"
instances = 3
priority = 200
exit_codes = [0, 2]
umask = "022"
