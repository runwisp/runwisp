; A representative supervisord config: a couple of long-running programs with
; the knobs RunWisp understands, plus daemon sections it should skip.

[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:web]
command=/usr/bin/gunicorn --workers 4 app:app
directory=/srv/app
user=www-data
autostart=true
autorestart=true
startsecs=10
startretries=3
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/var/log/web.log
stderr_logfile=/var/log/web.err
environment=DJANGO_SETTINGS="app.settings.prod",LOG_LEVEL=info

[program:worker]
command=/usr/local/bin/celery worker -A app --concurrency=2
directory=/srv/app
numprocs=3
priority=200
exitcodes=0,2
umask=022
