# Generated by `runwisp import`. Review the notes below, then
# validate with `runwisp validate`.

# crontab CRON_TZ/TZ became the daemon-wide scheduler timezone.
[scheduler]
timezone = "Europe/Bratislava"

[defaults]
shell = "/bin/bash"

# Environment variables that sat at the top of the crontab.
[defaults.env]
PATH = "/usr/local/bin:/usr/bin:/bin"

[tasks.backup]
description = "Nightly full backup"
cron = "30 2 * * *"
run = "/usr/local/bin/backup.sh --full"

[tasks.logrotate]
description = "Rotate logs every Sunday"
cron = "0 0 * * 0"
run = "/usr/sbin/logrotate /etc/logrotate.conf"

[tasks.cleanup]
cron = "@daily"
run = "/opt/app/cleanup"

# @reboot — runs once each time the daemon starts.
[tasks.warmup]
run_on_start = true
run = "/opt/app/warmup"

[tasks.sync]
description = "Heavy job, deprioritized"
cron = "*/15 * * * *"
run = "/usr/bin/nice -n 19 /opt/sync.sh"
