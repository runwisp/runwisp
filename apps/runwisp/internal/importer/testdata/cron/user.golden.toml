# Generated by `runwisp import`. Review the notes below, then
# validate with `runwisp validate`.

[tasks.backup]
description = "Nightly full backup"
cron = "30 2 * * *"
timezone = "Europe/Bratislava"
shell = "/bin/bash"
env_base = "clean"
working_dir = "~"
catch_up = 0  # cron never re-fires a missed tick
on_overlap = "queue"  # cron would overlap instead of queueing
run = "/usr/local/bin/backup.sh --full"

[tasks.backup.env]
CRON_TZ = "Europe/Bratislava"
PATH = "/usr/local/bin:/usr/bin:/bin"

[tasks.logrotate]
description = "Rotate logs every Sunday"
cron = "0 0 * * 0"
timezone = "Europe/Bratislava"
shell = "/bin/bash"
env_base = "clean"
working_dir = "~"
catch_up = 0  # cron never re-fires a missed tick
on_overlap = "queue"  # cron would overlap instead of queueing
run = "/usr/sbin/logrotate /etc/logrotate.conf"

[tasks.logrotate.env]
CRON_TZ = "Europe/Bratislava"
PATH = "/usr/local/bin:/usr/bin:/bin"

[tasks.cleanup]
cron = "@daily"
timezone = "Europe/Bratislava"
shell = "/bin/bash"
env_base = "clean"
working_dir = "~"
catch_up = 0  # cron never re-fires a missed tick
on_overlap = "queue"  # cron would overlap instead of queueing
run = "/opt/app/cleanup"

[tasks.cleanup.env]
CRON_TZ = "Europe/Bratislava"
PATH = "/usr/local/bin:/usr/bin:/bin"

# @reboot: runs once per machine boot, not on daemon restarts.
[tasks.warmup]
run_on_start = "boot"
timezone = "Europe/Bratislava"
shell = "/bin/bash"
env_base = "clean"
working_dir = "~"
on_overlap = "queue"  # cron would overlap instead of queueing
run = "/opt/app/warmup"

[tasks.warmup.env]
CRON_TZ = "Europe/Bratislava"
PATH = "/usr/local/bin:/usr/bin:/bin"

[tasks.sync]
description = "Heavy job, deprioritized"
cron = "*/15 * * * *"
timezone = "Europe/Bratislava"
shell = "/bin/bash"
env_base = "clean"
working_dir = "~"
catch_up = 0  # cron never re-fires a missed tick
on_overlap = "queue"  # cron would overlap instead of queueing
run = "/usr/bin/nice -n 19 /opt/sync.sh"

[tasks.sync.env]
CRON_TZ = "Europe/Bratislava"
PATH = "/usr/local/bin:/usr/bin:/bin"
