# Generated by `runwisp import`. Review the notes below, then
# validate with `runwisp validate`.

[tasks.apt-get]
description = "Run the updater as root every morning"
cron = "17 6 * * *"
user = "root"
shell = "/bin/sh"
env_base = "clean"
working_dir = "~"
run = "/usr/bin/apt-get update"

[tasks.apt-get.env]
PATH = "/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin"

[tasks.cleanup]
description = "Per-user maintenance"
cron = "*/10 * * * *"
user = "deploy"
shell = "/bin/sh"
env_base = "clean"
working_dir = "~"
run = "/usr/local/bin/cleanup --quiet"

[tasks.cleanup.env]
PATH = "/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin"

[tasks.vacuumdb]
cron = "0 4 * * 1"
user = "postgres"
shell = "/bin/sh"
env_base = "clean"
working_dir = "~"
run = "/usr/bin/vacuumdb --all"

[tasks.vacuumdb.env]
PATH = "/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin"

# @reboot — runs once each time the daemon starts.
[tasks.warmup]
description = "A descriptor line carries the user column too"
run_on_start = true
user = "root"
shell = "/bin/sh"
env_base = "clean"
working_dir = "~"
run = "/usr/bin/warmup"

[tasks.warmup.env]
PATH = "/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin"
