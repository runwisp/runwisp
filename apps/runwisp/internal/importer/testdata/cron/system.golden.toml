# Generated by `runwisp import`. Review the notes below, then
# validate with `runwisp validate`.

[defaults]
shell = "/bin/sh"

# Environment variables that sat at the top of the crontab.
[defaults.env]
PATH = "/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin"

[tasks.apt-get]
description = "Run the updater as root every morning"
cron = "17 6 * * *"
user = "root"
run = "/usr/bin/apt-get update"

[tasks.cleanup]
description = "Per-user maintenance"
cron = "*/10 * * * *"
user = "deploy"
run = "/usr/local/bin/cleanup --quiet"

[tasks.vacuumdb]
cron = "0 4 * * 1"
user = "postgres"
run = "/usr/bin/vacuumdb --all"
