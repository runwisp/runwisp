# Generated by `runwisp import`. Review the notes below, then
# validate with `runwisp validate`.

[tasks.rollup]
cron = "0 4 * * *"
timezone = "Mars/Olympus"  # TODO: RunWisp couldn't use this timezone — fix it.
env_base = "clean"
working_dir = "~"
catch_up = 0  # cron never re-fires a missed tick
on_overlap = "queue"  # cron would overlap instead of queueing
run = "/usr/bin/rollup"

[tasks.rollup.env]
CRON_TZ = "Mars/Olympus"

# @reboot: runs once per machine boot, not on daemon restarts.
[tasks.warmup]
run_on_start = "boot"
timezone = "Mars/Olympus"  # TODO: RunWisp couldn't use this timezone — fix it.
env_base = "clean"
working_dir = "~"
on_overlap = "queue"  # cron would overlap instead of queueing
run = "/usr/bin/warmup"

[tasks.warmup.env]
CRON_TZ = "Mars/Olympus"
