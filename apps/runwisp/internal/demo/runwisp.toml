# RunWisp demo configuration — "Acme Notes" persona.
#
# Purpose: a maintained, screenshot-ready config that populates the Web UI,
# TUI, and notification surfaces with believable runs. The fictional operator
# is a bootstrapped SaaS team on a single VPS: Postgres-backed app, a couple
# of background workers, basic health checks, manual deploys.
#
# This file is embedded into the binary and powers `runwisp demo`, which boots
# a throwaway daemon (temp config + data dir) pre-seeded with hundreds of fake
# historical runs so you can explore the TUI and Web UI without writing config.
# It also doubles as a manual screenshot config:
#   runwisp daemon -c apps/runwisp/internal/demo/runwisp.toml --data /tmp/runwisp-demo
#
# `runwisp demo` is zero-setup, so the Slack and Telegram notifiers below carry
# inline *placeholder* secrets (the `.invalid` TLD never resolves). The notify
# subsystem boots cleanly offline and the in-app bell — the live notification
# surface — works out of the box. Outbound delivery to these placeholders just
# fails in the background, which is exactly how RunWisp treats any unreachable
# notifier: it's optional and never blocks a run. For real delivery during a
# shoot, swap in a working webhook URL / bot token (a webhook.site bin is
# enough for screenshots).
#
# Every `run` body uses commands available on a stock Linux/macOS box — no
# Postgres, no Docker — so screenshots reflect a genuinely running daemon.

[daemon]
shutdown_timeout = "15s"
external_url     = "https://runwisp.acme-notes.example"

[scheduler]
timezone = "Europe/Bratislava"

[defaults]
timeout      = "30m"
log_max_size = "20mb"
log_on_full  = "drop_old"
keep_runs    = 200
keep_for     = "30d"

[storage]
max_size       = "2gb"
min_free_space = "500mb"

[notify]
global_notifiers = ["inapp"]
coalesce_window  = "30s"
history_keep     = 500
history_keep_for = "30d"

# ── Notifiers ────────────────────────────────────────────────────────────────
# Placeholder secrets (`.invalid` never resolves) keep the demo self-contained
# and offline. Swap in real values for actual delivery; see the header comment.

[[notifier]]
id          = "slack-ops"
type        = "slack"
webhook_url = "https://hooks.slack.invalid/services/T0DEMO/B0DEMO/ops"
channel     = "#ops-alerts"

[[notifier]]
id          = "slack-deploys"
type        = "slack"
webhook_url = "https://hooks.slack.invalid/services/T0DEMO/B0DEMO/deploys"
channel     = "#deploys"

[[notifier]]
id        = "telegram-oncall"
type      = "telegram"
bot_token = "123456789:DEMO-not-a-real-telegram-token"
chat_id   = "-1001234567890"

# ── Routes ───────────────────────────────────────────────────────────────────

# Any backup-* failure pages ops and on-call; inline override sends Slack to
# the dedicated #backups channel.
[[notification_route]]
match  = { kind = ["run.failed", "run.timeout", "run.crashed"], task = "backup-*" }
notify = ["slack-ops:#backups", "telegram-oncall"]

# Surface successful deploys to the deploys channel.
[[notification_route]]
match  = { kind = ["run.succeeded"], task = "deploy-*" }
notify = ["slack-deploys"]

# Mirror notifier-delivery failures into the in-app bell so the operator
# notices a broken webhook without staring at the daemon log.
[[notification_route]]
match  = { kind = ["notify.delivery_failed"] }
notify = ["inapp"]

# ── Backups ──────────────────────────────────────────────────────────────────

[tasks.backup-postgres]
group             = "Backups"
description       = "Nightly logical dump of the primary Postgres cluster, then ship to off-box storage."
cron              = "15 3 * * *"
timeout           = "2h"
on_overlap        = "skip"
keep_runs         = 60
keep_for          = "60d"
notify_on_failure = ["slack-ops:#backups"]
# A single-line `\r` progress bar: the daemon collapses every percentage frame
# into one clean final line on disk, while live viewers watch the bar fill.
run = '''
set -eu
ESC=$(printf '\033')
BOLD="${ESC}[1m"; GREEN="${ESC}[32m"; RST="${ESC}[0m"
echo "${BOLD}[backup]${RST} starting snapshot at $(date -u +%FT%TZ)"
echo "[backup] dumping schema (142 tables, 318 indexes)"
total=30
i=0
while [ "$i" -le "$total" ]; do
  pct=$(( i * 100 / total ))
  filled=$(( i * 28 / total ))
  bar=""; j=0
  while [ "$j" -lt "$filled" ]; do bar="${bar}#"; j=$(( j + 1 )); done
  while [ "$j" -lt 28 ]; do bar="${bar}."; j=$(( j + 1 )); done
  printf '\r[backup] pg_dump  [%s] %3d%%  %3dMB' "$bar" "$pct" "$(( i * 482 / total ))"
  i=$(( i + 1 ))
  sleep 0.04
done
printf '\n'
echo "[backup] snapshot complete: 482M compressed in 12.3s"
i=0
while [ "$i" -le "$total" ]; do
  pct=$(( i * 100 / total ))
  filled=$(( i * 28 / total ))
  bar=""; j=0
  while [ "$j" -lt "$filled" ]; do bar="${bar}#"; j=$(( j + 1 )); done
  while [ "$j" -lt 28 ]; do bar="${bar}."; j=$(( j + 1 )); done
  printf '\r[backup] upload s3 [%s] %3d%%' "$bar" "$pct"
  i=$(( i + 1 ))
  sleep 0.03
done
printf '\n'
echo "${GREEN}[backup]${RST} uploaded to s3://acme-notes-backups/$(date -u +%F)/"
'''

[tasks.backup-restore-test]
group             = "Backups"
description       = "Restores last night's dump into a throwaway database and verifies the schema fingerprint."
cron              = "30 5 * * *"
timeout           = "1h"
retry_attempts    = 1
retry_delay       = "5m"
retry_backoff     = "exponential"
notify_on_failure = ["slack-ops"]
run = '''
set -euo pipefail
echo "[restore-test] booting throwaway cluster on :15432"
echo "[restore-test] restoring $(date -u -d 'yesterday' +%F 2>/dev/null || date -u -v -1d +%F).dump (482M)"
sleep 2
if [ $((RANDOM % 8)) -eq 0 ]; then
  echo "[restore-test] schema fingerprint mismatch on public.notes" >&2
  exit 1
fi
echo "[restore-test] verifying schema fingerprint"
echo "[restore-test] all 142 tables match production"
'''

# ── Health ───────────────────────────────────────────────────────────────────

[tasks.healthcheck-api]
group             = "Health"
description       = "Probes the public API every five minutes. Two retries before paging on-call."
cron              = "*/5 * * * *"
timeout           = "30s"
retry_attempts    = 2
retry_delay       = "10s"
notify_on_failure = ["slack-ops"]
run = '''
set -eu
if [ $((RANDOM % 12)) -eq 0 ]; then
  echo "[health] api probe failed: upstream returned 502" >&2
  exit 1
fi
echo "Responsibility is a unique concept."
echo "[health] api ok at $(date -u +%H:%M:%SZ)"
'''

[tasks.healthcheck-tls]
group             = "Health"
description       = "Reads the production TLS cert and asserts more than 14 days of life remain."
cron              = "0 */6 * * *"
timeout           = "1m"
notify_on_failure = ["slack-ops:#certs"]
run = '''
set -eu
host=github.com
exp=$(date -u -d '+71 days' '+%b %e %H:%M:%S %Y GMT' 2>/dev/null || date -u -v+71d '+%b %e %H:%M:%S %Y GMT')
echo "[tls] $host cert valid; expires $exp"
'''

[tasks.cache-prewarm-probe]
group       = "Health"
description = "Warms the edge cache and asserts it answers within the 2s SLA; a cold origin occasionally blows the budget and the run is killed."
cron        = "*/15 * * * *"
timeout     = "2s"
keep_runs   = 30
notify_on_failure = ["slack-ops"]
run = '''
set -eu
echo "[prewarm] priming edge cache"
if [ $((RANDOM % 6)) -eq 0 ]; then
  echo "[prewarm] origin slow; still waiting on cold keys..." >&2
  sleep 5
fi
echo "[prewarm] warm in $((RANDOM % 800 + 100))ms"
'''

# ── Maintenance ──────────────────────────────────────────────────────────────

[tasks.rotate-logs]
group       = "Maintenance"
description = "Compresses last week's app logs and prunes anything older than 30 days."
cron        = "0 4 * * 0"
keep_runs   = 12
keep_for    = "180d"
# A multi-line ANSI redraw (cursor-up + erase-line, like `docker pull`): four
# per-file bars animate in place, and only the settled final frame is committed.
run = '''
set -eu
ESC=$(printf '\033')
GREEN="${ESC}[32m"; DIM="${ESC}[2m"; RST="${ESC}[0m"
echo "[rotate] scanning /var/log/acme-notes"
files="app.log worker.log access.log audit.log"
printf '%s[?25l' "$ESC"
for f in $files; do printf '  %-11s %squeued%s\n' "$f" "$DIM" "$RST"; done
step=0
remaining=4
while [ "$remaining" -gt 0 ]; do
  printf '%s[4A' "$ESC"
  remaining=0
  k=0
  for f in $files; do
    pct=$(( step * 13 - k * 17 ))
    if [ "$pct" -lt 0 ]; then pct=0; fi
    if [ "$pct" -gt 100 ]; then pct=100; fi
    if [ "$pct" -lt 100 ]; then remaining=$(( remaining + 1 )); fi
    filled=$(( pct * 20 / 100 ))
    bar=""; i=0
    while [ "$i" -lt "$filled" ]; do bar="${bar}#"; i=$(( i + 1 )); done
    while [ "$i" -lt 20 ]; do bar="${bar} "; i=$(( i + 1 )); done
    if [ "$pct" -ge 100 ]; then
      printf '\r  %-11s [%s] %sgz done%s%s[K\n' "$f" "$bar" "$GREEN" "$RST" "$ESC"
    else
      printf '\r  %-11s [%s] %3d%%%s[K\n' "$f" "$bar" "$pct" "$ESC"
    fi
    k=$(( k + 1 ))
  done
  step=$(( step + 1 ))
  sleep 0.13
done
printf '%s[?25h' "$ESC"
echo "${GREEN}[rotate]${RST} compressed 4 files, freed 312 MB"
echo "[rotate] removed 8 archives older than 30 days"
'''

[tasks.disk-usage-report]
group       = "Maintenance"
description = "Posts a snapshot of disk usage to the ops channel each morning."
cron        = "30 7 * * *"
timeout     = "1m"
run = '''
df -h / | awk 'NR==1 || NR==2 { print }'
'''

# ── Deploys ──────────────────────────────────────────────────────────────────

[tasks.deploy-migrate]
group             = "Deploys"
description       = "Database migrations. Triggered from the deploy pipeline via the REST API; never scheduled."
api_trigger       = true
timeout           = "10m"
on_overlap        = "skip"
notify_on_success = ["slack-deploys"]
notify_on_failure = ["slack-ops", "telegram-oncall"]
# Partial-line output: each "applying … " is written without a trailing newline,
# so live viewers see the in-flight step before its "ok" lands and the line is
# committed whole.
run = '''
set -eu
ESC=$(printf '\033')
GREEN="${ESC}[32m"; DIM="${ESC}[2m"; RST="${ESC}[0m"
echo "[migrate] HEAD = a1b2c3d"
echo "[migrate] applying 3 pending migrations"
for m in 0042_add_user_locale 0043_widen_org_slug 0044_index_run_created_at; do
  printf '  %s%s.sql%s ... ' "$DIM" "$m" "$RST"
  sleep 0.25
  printf '%sok%s\n' "$GREEN" "$RST"
done
echo "${GREEN}[migrate]${RST} done in 0.8s"
'''

# ── Manual / heavy jobs ──────────────────────────────────────────────────────
# These never run on a schedule — an operator kicks them off by hand after a
# schema change or a data import. They emit a *lot* of output, so they're handy
# for exercising the log viewer's paging and search on a genuinely large run.

[tasks.reindex-search]
group       = "Manual"
description = "Rebuilds the full-text search index from scratch. Run by hand after a mapping change — emits one line per indexed document, so expect tens of thousands of lines."
api_trigger = true
timeout     = "1h"
keep_runs   = 20
log_max_size = "200mb"
run = '''
set -eu
echo "[reindex] dropping search index 'notes_v4'"
echo "[reindex] streaming documents from primary"
n=0
while [ "$n" -lt 8000 ]; do
  n=$((n + 1))
  printf "[reindex] indexed doc org=%s id=%08d (%s tokens)\n" "$((n % 37 + 1))" "$n" "$((n % 400 + 20))"
done
echo "[reindex] committing segment, optimizing"
echo "[reindex] done: 8000 docs in 4.7s"
'''

[tasks.import-legacy-data]
group       = "Manual"
description = "One-off importer for the legacy MySQL export. Verbose by design: every row that needs a fix-up is logged as the full rewrite statement, so the lines run wide and the migration is auditable."
api_trigger = true
timeout     = "2h"
keep_runs   = 20
log_max_size = "200mb"
run = '''
set -eu
echo "[import] opening legacy_dump.sql (3.2 GB)"
now=$(date -u +%FT%TZ)
for table in users orgs notes attachments audit_log; do
  echo "[import] === table ${table} ==="
  r=0
  while [ "$r" -lt 500 ]; do
    r=$((r + 1))
    printf "[import] %s row %06d migrated -> UPDATE %s SET migrated_at='%s', source_ref='legacy:%s:%06d', payload='{\"region\":\"eu-central-1\",\"notes\":\"re-encoded latin1->utf8, normalized timestamps to UTC, rewrote %s legacy column aliases, verified referential integrity against parent rows\"}' WHERE id=%06d AND tenant_shard IN ('shard-a','shard-b','shard-c');\n" "$table" "$r" "$table" "$now" "$table" "$r" "$((r % 4))" "$r"
  done
  echo "[import] ${table}: 500 rows in 1.1s"
done
echo "[import] rebuilding foreign keys"
echo "[import] complete"
'''

# ── Parameterised manual job ─────────────────────────────────────────────────
# A showcase for per-execution parameters. Support kicks this off by hand for a
# specific tenant and dials in the format / region / limit / flags at trigger
# time. The `params` below are *declared* here — TOML is the only place they're
# defined — and the Web UI, TUI, and REST API grow a little form to *supply*
# values. Every value reaches the command as an env var ($ORG_ID) or an inert
# argv token appended after the script (never spliced into the shell), so a
# value like `; rm -rf /` typed into a field stays a harmless literal. It covers
# all four kinds (env / arg / option / flag) and every modifier (required,
# default, choices, allow_custom, number, description) so the form exercises
# each control.

[tasks.export-org-data]
group       = "Manual"
description = "On-demand data export for a single tenant (GDPR / data-portability request). Run by hand with per-execution parameters — pick the tenant, format, region, and options when you trigger it."
api_trigger = true
timeout     = "20m"
keep_runs   = 40
params = [
  { env    = "ORG_ID", required = true, description = "Tenant whose data to export (e.g. acme)." },
  { arg    = "format", choices = ["json", "csv", "ndjson"], default = "json", description = "Output file format." },
  { option = "--since", default = "2024-01-01", description = "Only export records created on or after this date (YYYY-MM-DD)." },
  { option = "--region", choices = ["us", "eu", "ap"], default = "eu", description = "Storage region to read the tenant from." },
  { option = "--shard", choices = ["shard-a", "shard-b", "shard-c"], allow_custom = true, description = "Primary shard; type a custom name for a migrated tenant." },
  { option = "--limit", type = "number", default = 5000, description = "Maximum number of records to export." },
  { flag   = "--include-attachments", description = "Bundle uploaded files alongside the exported records." },
]
# The trailing printf's %s format cycles over every appended argv token, so the
# log echoes exactly what RunWisp handed the command. The closing ''' sits on
# the same line as that printf so the tokens append to it, not a new statement.
run = '''
set -eu
echo "[export] tenant=${ORG_ID} — preparing export"
printf '[export] arg → %s\n' '''

# ── Reports ──────────────────────────────────────────────────────────────────

[tasks.weekly-billing-rollup]
group             = "Reports"
description       = "Aggregates the previous week's usage events and emails the rollup to finance."
cron              = "0 6 * * 1"
timeout           = "30m"
notify_on_success = ["slack-deploys:#finance"]
run = '''
set -eu
since=$(date -u -d 'last monday' +%F 2>/dev/null || date -u -v -monday +%F)
echo "[billing] window: ${since} → $(date -u +%F)"
echo "[billing] 18,432 events processed"
echo "[billing] usage_rollup.csv (412 KB) generated"
echo "[billing] report mailed to finance@acme-notes.example"
'''

# ── Services ─────────────────────────────────────────────────────────────────

[services.queue-worker]
group               = "Services"
description         = "Background worker for the email + webhook queues. Two parallel instances."
instances           = 2
graceful_stop       = "15s"
restart_delay       = "2s"
restart_backoff     = "exponential"
healthy_after       = "2m"
run = '''
set -eu
echo "[worker $$] starting"
while true; do
  printf "[worker %s] processed %s jobs (last: %s)\n" "$$" "$((RANDOM % 8 + 1))" "$(date -u +%H:%M:%S)"
  sleep 7
done
'''

[services.cache-warmer]
group         = "Services"
description   = "Keeps the hottest Redis keys warm so cold deploys don't stall the home page."
graceful_stop = "5s"
restart_delay = "5s"
run = '''
set -eu
echo "[warmer $$] booting"
while true; do
  echo "[warmer $$] refreshed 14 keys ($(date -u +%H:%M:%SZ))"
  sleep 12
done
'''
