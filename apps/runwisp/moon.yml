$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'go'
layer: 'application'

fileGroups:
  # ensure-ui-dist.sh is sourced by every Go entry-point script.
  go: ['cmd/**/*.go', 'internal/**/*.go', 'go.mod', 'go.sum', 'scripts/ensure-ui-dist.sh']
  # Non-Go assets compiled into the binary via //go:embed. They are build
  # inputs even though they aren't .go files, so the build cache must key on
  # them — otherwise editing e.g. the demo config leaves a stale binary.
  # internal/ui/dist and internal/storage/schema.sql are omitted: they reach
  # the build transitively via the sync-ui-dist and sqlc-generate deps.
  embeds:
    - 'internal/demo/runwisp.toml'
    - 'internal/autostart/templates/*.tmpl'
    - 'internal/notify/render/defaults/**/*'

tasks:
  sqlc-generate:
    description: 'Generate Go storage code from SQL via a pinned sqlc.'
    command: './scripts/sqlc-generate.sh'
    toolchain: 'system'
    inputs:
      - 'scripts/sqlc-generate.sh'
      - 'sqlc.yaml'
      - 'internal/storage/schema.sql'
      - 'internal/storage/query/**/*.sql'
    outputs:
      - 'internal/storage/sqlcdb'

  openapi:
    description: 'Regenerate openapi.json from the Go app.'
    command: './scripts/generate-openapi.sh'
    toolchain: 'system'
    deps:
      - 'asyncapi:generate'
      - '~:sqlc-generate'
    inputs:
      - '@globs(go)'
      - 'scripts/generate-openapi.sh'
    outputs:
      - 'openapi.json'

  sync-ui-dist:
    description: 'Copy the built web UI into the go:embed directory.'
    command: './scripts/sync-ui-dist.sh'
    toolchain: 'system'
    deps:
      - 'web-ui:build'
    inputs:
      - 'scripts/sync-ui-dist.sh'
    outputs:
      - 'internal/ui/dist'

  build:
    description: 'Build the runwisp binary (web UI embedded).'
    command: './scripts/build.sh'
    toolchain: 'system'
    deps:
      - '~:sync-ui-dist'
      - '~:sqlc-generate'
      - 'asyncapi:generate'
    inputs:
      - '@globs(go)'
      - '@globs(embeds)'
      - 'scripts/build.sh'
      - 'scripts/metadata.sh'
      - '/CHANGELOG.md'
    outputs:
      - 'runwisp'

  build-all:
    description: 'Cross-compile binaries for all supported platforms.'
    command: './scripts/build-all.sh'
    toolchain: 'system'
    deps:
      - '~:sync-ui-dist'
      - '~:sqlc-generate'
      - 'asyncapi:generate'
    options:
      # Output varies with TARGETS / RELEASE env vars.
      cache: false

  check:
    description: 'go vet + golangci-lint + gofmt.'
    command: './scripts/check-go.sh'
    toolchain: 'system'
    deps:
      - '~:sqlc-generate'
      - 'asyncapi:generate'
    inputs:
      - '@globs(go)'
      - 'tests/**/*.go'
      - 'scripts/check-go.sh'
      - 'scripts/lint-go.sh'
      - '.golangci.yml'

  format:
    command: 'go fmt ./...'
    toolchain: 'system'
    options:
      cache: false

  test:
    description: 'Go unit + e2e tests with merged coverage profile.'
    command: './scripts/test-go.sh'
    toolchain: 'system'
    deps:
      - '~:sqlc-generate'
      - 'asyncapi:generate'
    inputs:
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'tests/**/*'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/test-go.sh'
      - 'scripts/merge-coverage.sh'
      - 'scripts/ensure-ui-dist.sh'
    outputs:
      - 'coverage.out'

  test-e2e:
    # On runwisp, not web-ui: a web-ui dep on runwisp:build would cycle the
    # project graph (runwisp already depends on web-ui via sync-ui-dist).
    description: 'Playwright e2e against the built runwisp binary.'
    script: 'cd ../ui && playwright test'
    deps:
      - '~:build'
    inputs:
      - '/apps/ui/e2e/**/*'
      - '/apps/ui/playwright.config.ts'

  screenshots:
    # Regenerates the docs Web UI *and* TUI screenshots (apps/docs) from a
    # demo-seeded daemon. On-demand only — never wired into check/test/ci. On
    # runwisp (not web-ui) for the same project-graph reason as test-e2e.
    #
    # Two stages, one command:
    #   1. Go capture — drives the real `runwisp tui` in a pty and dumps the raw
    #      terminal stream per screen to .tui-frames/tui-<name>.ansi.
    #   2. Playwright — the screenshots config renders the web UI live AND
    #      replays each .ansi frame through xterm.js (tui.screenshots.ts),
    #      writing every PNG into apps/docs.
    description: 'Generate the docs Web UI + TUI screenshots from a demo-seeded daemon.'
    script: |
      set -e
      FRAMES="$(pwd)/.tui-frames"
      rm -rf "$FRAMES" && mkdir -p "$FRAMES"
      RUNWISP_TUI_SHOOT_DIR="$FRAMES" go test ./tests/e2e -run '^TestCaptureTUIScreenshots$' -count=1
      cd ../ui && RUNWISP_TUI_FRAMES="$FRAMES" playwright test --config playwright.screenshots.config.ts
    deps:
      - '~:build'
    options:
      # Writes binary PNGs into apps/docs and drives live runs — not cacheable.
      cache: false

  dev:
    description: 'Build, then run the binary (pass args after --).'
    command: './runwisp'
    toolchain: 'system'
    deps:
      - '~:build'
    preset: 'server'
    options:
      interactive: true

  demo:
    description: 'Build, then run the binary in demo mode (pass args after --).'
    extends: 'dev'
    args: 'demo'
