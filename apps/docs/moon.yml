$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "application"

tasks:
    dev:
        script: "bun scripts/sync-openapi.ts && bunx --bun astro dev --host 0.0.0.0 --port 4377"
        deps:
            - "runwisp:openapi"
        preset: "server"

    build:
        # Delegates to the package.json script: Cloudflare Pages runs that
        # script directly (it can't run moon's Go-dependent task graph), so
        # package.json stays the single definition of the docs build.
        description: "Astro/Starlight docs build."
        command: "bun run build"
        deps:
            - "runwisp:openapi"
        inputs:
            - "**/*"
            - "/apps/runwisp/openapi.json"
            - "/apps/runwisp/internal/config/config.schema.json"
            - "/packages/ui/src/**/*"
        outputs:
            - "dist"

    preview:
        command: "bunx --bun astro preview"
        deps:
            - "~:build"
        preset: "server"

    check:
        # Not split types/lint: eslint needs the .astro/types.d.ts that `astro check` generates.
        # `~:links` dep means moon runs the link check as part of this task —
        # it also gives `links` its own cache key and lets it be run on its own.
        description: "astro check, then prettier --check + eslint + docs link check."
        script: "bun scripts/sync-openapi.ts && bunx --bun astro check && prettier --check . && eslint ."
        deps:
            - "runwisp:openapi"
            - "~:links"
        inputs:
            - "**/*"
            - "/apps/runwisp/openapi.json"
            - "/apps/runwisp/internal/config/config.schema.json"
            - "/packages/ui/src/**/*"
            - "/prettier.base.cjs"

    links:
        # Validates every link this repo controls that points into the docs site:
        # docs-to-docs links in src/content/docs (markdown *and* JSX `href=`)
        # resolve to a real file and, when an anchor is present, to a real
        # heading there; /api/<operationId> links are checked against
        # openapi.json so the starlight-openapi generated routes are covered;
        # and absolute docs.runwisp.com URLs embedded elsewhere in the repo
        # (README, SECURITY, install.sh, the Go sources, the config schema) are
        # checked too — hence the inputs reaching outside this project.
        description: "Validate all docs links resolve (file + anchor), in-docs and repo-wide."
        command: "bun scripts/check-docs-links.ts"
        deps:
            - "runwisp:openapi"
        inputs:
            - "src/content/docs/**/*"
            - "scripts/check-docs-links.ts"
            - "astro.config.mjs"
            - "/apps/runwisp/openapi.json"
            - "/apps/runwisp/**/*.go"
            - "/apps/runwisp/internal/config/config.schema.json"
            - "/README.md"
            - "/SECURITY.md"
            - "/scripts/install.sh"

    format:
        command: "prettier --write ."
        options:
            cache: false
