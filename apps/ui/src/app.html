<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="runwisp - Modern task scheduling and task execution platform"
        />
        <title>RunWisp</title>
        <script>
            // Apply the persisted theme before first paint to avoid a flash of the
            // wrong theme. Keep the key/logic in sync with stores/theme.svelte.ts.
            (function () {
                try {
                    var p = localStorage.getItem("runwisp-theme") || "auto";
                    var dark =
                        p === "dark" ||
                        (p === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    if (dark) document.documentElement.classList.add("dark");
                } catch (e) {}
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
