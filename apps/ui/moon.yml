$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "application"

fileGroups:
    sources:
        - "src/**/*"
        - "static/**/*"
        - "svelte.config.js"
        - "vite.config.ts"
        - "tsconfig.json"
        - "package.json"
    upstream:
        - "/packages/ui/src/**/*"
        - "/packages/common/src/**/*"

# Two shared quirks across the tasks below:
# - A git worktree may symlink .svelte-kit back to the main checkout; SvelteKit
#   bakes depth-sensitive paths into it, so the script-form tasks drop the link
#   before running `svelte-kit sync`.
# - Every task that runs `svelte-kit sync` (directly or via the vite plugin)
#   shares the `svelte-kit-sync` mutex: concurrent syncs corrupt .svelte-kit.
tasks:
    dev:
        command: "vite dev"
        preset: "server"

    build:
        description: "Vite build of the embedded dashboard."
        script: "{ [ -L .svelte-kit ] && rm -f .svelte-kit || true; } && vite build"
        deps:
            - "common:generate-api"
            - "asyncapi:generate"
        inputs:
            - "@globs(sources)"
            - "@globs(upstream)"
        outputs:
            - "build"
        options:
            mutex: "svelte-kit-sync"

    check-types:
        description: "svelte-check."
        script: "{ [ -L .svelte-kit ] && rm -f .svelte-kit || true; } && svelte-kit sync && svelte-check --tsconfig ./tsconfig.json"
        deps:
            - "common:generate-api"
            - "asyncapi:generate"
        inputs:
            - "@globs(sources)"
            - "@globs(upstream)"
        options:
            mutex: "svelte-kit-sync"

    check-lint:
        description: "prettier --check + eslint."
        script: "svelte-kit sync && prettier --check . && eslint ."
        inputs:
            - "**/*"
            - "/prettier.base.cjs"
        options:
            mutex: "svelte-kit-sync"

    check:
        command: "noop"
        deps:
            - "~:check-types"
            - "~:check-lint"

    format:
        command: "prettier --write ."
        options:
            cache: false

    test:
        description: "vitest with coverage."
        script: "svelte-kit sync && vitest run --coverage"
        deps:
            - "common:generate-api"
            - "asyncapi:generate"
        inputs:
            - "@globs(sources)"
            - "@globs(upstream)"
            - "test/**/*"
            - "vitest.config.ts"
        outputs:
            - "coverage"
        options:
            mutex: "svelte-kit-sync"
