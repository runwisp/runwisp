[tasks.echo-task]
description = "Emits a few lines of stdout for basic streaming tests"
run = """
echo "echo-line-1"
echo "echo-line-2"
echo "echo-line-3"
"""

[tasks.fail-task]
description = "Exits non-zero after a little output"
run = """
echo "fail-line-1"
>&2 echo "fail-line-2-stderr"
exit 1
"""

[tasks.slow-task]
description = "Blocks until stopped, so the UI can observe a running run + the Stop control"
run = """
echo "slow-start"
# Block until the test stops the run — no arbitrary sleep, no wall-clock cost.
tail -f /dev/null
"""

[tasks.timed-task]
description = "Emits staggered output over ~6s then exits 0, so the UI can observe status transitions, log streaming, and a natural finish without a refresh"
run = """
echo "timed-phase-1"
sleep 2
echo "timed-phase-2"
sleep 2
echo "timed-phase-3"
sleep 2
echo "timed-done"
"""

[tasks.progress-task]
description = "Paints a carriage-return progress bar so the UI can render a settled redraw with rewindable frame history"
run = """
for p in 10 40 70 100; do
  printf 'progress: %d%%\r' "$p"
  sleep 0.2
done
printf '\n'
echo progress-done
"""

# Surface failed runs as in-app notifications so the bell + popover have
# something real to render. No outbound notifiers configured.
[[notification_route]]
match  = { kind = ["run.failed", "run.timeout", "run.crashed"] }
notify = ["inapp"]
