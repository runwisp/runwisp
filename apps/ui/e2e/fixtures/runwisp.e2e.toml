# Two-tier layout: runwisp.d/imported.toml holds a staged task so the dashboard
# renders the staged badge against real derived provenance, not a stub.
[daemon]
include = ["runwisp.d/*.toml"]

[tasks.echo-task]
description = "Emits a few lines of stdout for basic streaming tests"
run = """
echo "echo-line-1"
echo "echo-line-2"
echo "echo-line-3"
"""

[tasks.fail-task]
description = "Exits non-zero after a little output"
run = """
echo "fail-line-1"
>&2 echo "fail-line-2-stderr"
exit 1
"""

[tasks.slow-task]
description = "Blocks until stopped, so the UI can observe a running run + the Stop control"
run = """
echo "slow-start"
# Block until the test stops the run — no arbitrary sleep, no wall-clock cost.
tail -f /dev/null
"""

[tasks.timed-task]
description = "Emits staggered output over ~6s then exits 0, so the UI can observe status transitions, log streaming, and a natural finish without a refresh"
run = """
echo "timed-phase-1"
sleep 2
echo "timed-phase-2"
sleep 2
echo "timed-phase-3"
sleep 2
echo "timed-done"
"""

[tasks.progress-task]
description = "Paints a carriage-return progress bar so the UI can render a settled redraw with rewindable frame history"
run = """
for p in 10 40 70 100; do
  printf 'progress: %d%%\r' "$p"
  sleep 0.2
done
printf '\n'
echo progress-done
"""

[tasks.arrival-task]
description = "Exercised only by run-motion.spec, so its run list stays short"
run = "echo arrived"

[tasks.nightly-task]
description = "Cron task for schedule-pause.spec; fires only at midnight on 1 January"
cron = "0 0 1 1 *"
timezone = "UTC"
run = "echo nightly"

# Service controls for task-controls.spec. Not autostarted, so it sits stopped
# (and runs nothing) except while that spec starts it.
[services.idle-service]
description = "Service for task-controls.spec"
run = "sleep 3600"
autostart = false

# Output long enough to scroll, for the header fold in task-strip.spec, plus
# env for its Details sheet.
[tasks.long-output-task]
description = "Prints enough lines to scroll the console"
run = 'for i in $(seq 1 400); do echo "long-line-$i"; done'
env = { BUCKET = "acme" }

# Two names that differ only in punctuation; the UI must keep them apart.
[tasks.twin-task]
run = "true"

[tasks."twin.task"]
run = "true"

# Surface failed runs as in-app notifications so the bell + popover have
# something real to render. No outbound notifiers configured.
[[route]]
match     = { kinds = ["failed", "timeout", "crashed"] }
notifiers = ["inapp"]
