# Two-stage release pipeline:
#
#   1. Push a `v*` tag → build cross-platform binaries and create a GitHub Release
#      **draft** containing the tarballs, sha256 checksums, and the matching
#      CHANGELOG.md section as the body. Nothing is published to npm at this stage.
#
#   2. Publish the GitHub Release (human clicks "Publish release" on the draft)
#      → publish every npm package at the release's tag version:
#        - workspace TS packages (@runwisp/{typescript-config,eslint-config,common,ui}) in parallel
#        - binary platform packages (@runwisp/{linux,darwin}-{x64,arm64}) in parallel
#        - main `runwisp` package (waits for the platform packages to be live first)
#      → build and push the runwisp/runwisp Docker image (alpine + debian,
#        linux/amd64 + linux/arm64) to Docker Hub, from the same release tarballs.
#
# Auth is OIDC Trusted Publisher (per-package, configured on npmjs.com) for npm,
# and a Docker Hub access token (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo
# secrets) for the image push.
# Each npm package must already exist with a Trusted Publisher row pointing at
# this repo + workflow before CI can publish to it.
#
# docker-publish can also be re-run manually (workflow_dispatch, given an
# existing release tag) without touching the npm jobs — for retrying a failed
# Docker Hub push, or a dry run against an already-published release.

name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)publish the Docker image for"
        required: true

jobs:
  build:
    if: github.event_name == 'push'
    name: Build binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_prerelease: ${{ steps.npm_tag.outputs.PRERELEASE }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runwisp/go.mod
          cache-dependency-path: apps/runwisp/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build web UI and sync into Go embed directory
        run: bunx moon run runwisp:sync-ui-dist

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease flag
        id: npm_tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [[ "${VERSION}" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify CHANGELOG matches release tag
        working-directory: apps/runwisp
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          changelog_version=$(./scripts/metadata.sh version)
          if [[ "${VERSION}" != "${changelog_version}" ]]; then
            printf 'Tag %s does not match top CHANGELOG entry %s\n' \
              "${VERSION}" "${changelog_version}" >&2
            exit 1
          fi

      - name: Cross-compile binaries
        working-directory: apps/runwisp
        env:
          RELEASE: "1"
        run: ./scripts/build-all.sh

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: apps/runwisp/dist/

  github-release:
    if: github.event_name == 'push'
    name: Create GitHub Release draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: CHANGELOG.md

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "BODY<<RELEASE_NOTES_EOF"
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              /^## \[/ { if (found) exit }
              found
            ' CHANGELOG.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Package archives
        run: |
          for dir in dist/*/; do
            target=$(basename "${dir}")
            tar czf "runwisp-${target}.tar.gz" -C "${dir}" runwisp
          done

      - name: Generate checksums
        run: sha256sum runwisp-*.tar.gz > checksums-sha256.txt

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          body: ${{ steps.notes.outputs.BODY }}
          files: |
            runwisp-*.tar.gz
            checksums-sha256.txt

  npm-publish-workspace:
    if: github.event_name == 'release'
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/typescript-config
          - packages/eslint-config
          - packages/common
          - packages/ui
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          sparse-checkout: ${{ matrix.package }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Compute version and dist-tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            prerelease="${VERSION#*-}"
            echo "NPM_TAG=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip publish if package unchanged since last published version
        id: changes
        env:
          PKG_DIR: ${{ matrix.package }}
        run: |
          pkg_name=$(node -p "require('./${PKG_DIR}/package.json').name")
          prev_version=$(npm view "${pkg_name}" version 2>/dev/null || true)
          if [[ -z "${prev_version}" ]]; then
            echo "No previously published version of ${pkg_name}; will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev_tag="v${prev_version}"
          if ! git fetch --depth=1 origin "refs/tags/${prev_tag}:refs/tags/${prev_tag}" 2>/dev/null; then
            echo "Previous tag ${prev_tag} could not be fetched; will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${prev_tag}" HEAD -- "${PKG_DIR}"; then
            echo "No changes in ${PKG_DIR} since ${prev_tag}; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in ${PKG_DIR} since ${prev_tag}; will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version and replace workspace deps
        if: steps.changes.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PKG_DIR: ${{ matrix.package }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const version = process.env.VERSION;
            const file = path.join(process.env.PKG_DIR, 'package.json');
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = version;
            const replaceWorkspace = (deps) => {
              if (!deps) return;
              for (const k of Object.keys(deps)) {
                if (typeof deps[k] === 'string' && deps[k].startsWith('workspace:')) {
                  deps[k] = version;
                }
              }
            };
            replaceWorkspace(pkg.dependencies);
            replaceWorkspace(pkg.devDependencies);
            replaceWorkspace(pkg.peerDependencies);
            replaceWorkspace(pkg.optionalDependencies);
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish
        if: steps.changes.outputs.skip != 'true'
        env:
          NPM_TAG: ${{ steps.version.outputs.NPM_TAG }}
          PKG_DIR: ${{ matrix.package }}
        run: npm publish "./${PKG_DIR}" --access public --tag "${NPM_TAG}" --provenance

  npm-publish-platform:
    if: github.event_name == 'release'
    name: Publish @runwisp/${{ matrix.platform }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          sparse-checkout: npm/${{ matrix.platform }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Compute version and dist-tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            prerelease="${VERSION#*-}"
            echo "NPM_TAG=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Download binary from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          gh release download "${TAG}" --pattern "runwisp-${PLATFORM}.tar.gz" --dir dist
          mkdir -p "dist/${PLATFORM}"
          tar xzf "dist/runwisp-${PLATFORM}.tar.gz" -C "dist/${PLATFORM}"
          cp "dist/${PLATFORM}/runwisp" "npm/${PLATFORM}/runwisp"
          chmod +x "npm/${PLATFORM}/runwisp"

      - name: Stamp version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PKG_DIR: npm/${{ matrix.platform }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const file = path.join(process.env.PKG_DIR, 'package.json');
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish
        env:
          NPM_TAG: ${{ steps.version.outputs.NPM_TAG }}
          PKG_DIR: npm/${{ matrix.platform }}
        run: npm publish "./${PKG_DIR}" --access public --tag "${NPM_TAG}" --provenance

  npm-publish-runwisp:
    if: github.event_name == 'release'
    name: Publish runwisp
    needs: npm-publish-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          sparse-checkout: npm/runwisp

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Compute version and dist-tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            prerelease="${VERSION#*-}"
            echo "NPM_TAG=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version and platform optionalDependencies
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        working-directory: npm/runwisp
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            for (const dep of Object.keys(pkg.optionalDependencies)) {
              pkg.optionalDependencies[dep] = process.env.VERSION;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish
        env:
          NPM_TAG: ${{ steps.version.outputs.NPM_TAG }}
        working-directory: npm/runwisp
        run: npm publish --access public --tag "${NPM_TAG}" --provenance

  docker-publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    name: Publish Docker image (${{ matrix.base }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        base: [alpine, debian]
    steps:
      # On a real release, check out the tag itself so docker/ matches exactly
      # what that release shipped. A manual workflow_dispatch re-run instead
      # keeps whatever ref it was dispatched from — letting a Dockerfile/
      # entrypoint fix be re-published against an existing release's binaries
      # without cutting a new one.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          sparse-checkout: docker

      - name: Compute version and prerelease flag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p /tmp/dl docker/context/amd64 docker/context/arm64
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern 'runwisp-linux-x64.tar.gz' --dir /tmp/dl
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern 'runwisp-linux-arm64.tar.gz' --dir /tmp/dl
          tar xzf /tmp/dl/runwisp-linux-x64.tar.gz -C docker/context/amd64
          tar xzf /tmp/dl/runwisp-linux-arm64.tar.gz -C docker/context/arm64
          chmod +x docker/context/amd64/runwisp docker/context/arm64/runwisp

      # Stable releases get the floating tags (X.Y, latest[-<base>]); a
      # prerelease (version contains "-") only ever gets its exact pinned tags,
      # so an rc/beta build never becomes the thing `docker pull` gives you by
      # default.
      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PRERELEASE: ${{ steps.version.outputs.PRERELEASE }}
          BASE: ${{ matrix.base }}
        run: |
          image="runwisp/runwisp"
          minor_version="${VERSION%.*}"
          suffix=""
          if [[ "${BASE}" == "debian" ]]; then
            suffix="-debian"
          fi

          tags=("${image}:${VERSION}${suffix}")
          if [[ "${BASE}" == "alpine" ]]; then
            tags+=("${image}:${VERSION}-alpine")
          fi
          if [[ "${PRERELEASE}" != "true" ]]; then
            tags+=("${image}:${minor_version}${suffix}")
            tags+=("${image}:latest${suffix}")
            if [[ "${BASE}" == "alpine" ]]; then
              tags+=("${image}:${minor_version}-alpine")
              tags+=("${image}:latest-alpine")
            fi
          fi

          {
            echo "TAGS<<TAGS_EOF"
            printf '%s\n' "${tags[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ matrix.base }}
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: ${{ steps.tags.outputs.TAGS }}

      # Pull back what we just published and check it actually runs. Without
      # this the release path has zero runtime verification: a mismatched binary
      # in the hand-arranged context, or a broken entrypoint, would only be
      # discovered by whoever pulled the image next.
      - name: Verify the published image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TAGS: ${{ steps.tags.outputs.TAGS }}
        run: |
          tag=$(printf '%s\n' "${TAGS}" | head -1)
          echo "verifying ${tag}"

          reported=$(docker run --rm --platform linux/amd64 "${tag}" runwisp --version)
          echo "${reported}"
          case "${reported}" in
            *"${VERSION}"*) ;;
            *)
              echo "image reports '${reported}', expected version ${VERSION}" >&2
              exit 1
              ;;
          esac

          # The entrypoint must still refuse a daemon with no auth setting.
          if docker run --rm --platform linux/amd64 "${tag}" >/tmp/gate.log 2>&1; then
            echo "expected a non-zero exit with no auth setting" >&2
            cat /tmp/gate.log >&2
            exit 1
          fi
          grep -q 'explicit auth setting' /tmp/gate.log || {
            echo "auth gate did not produce the expected message" >&2
            cat /tmp/gate.log >&2
            exit 1
          }
