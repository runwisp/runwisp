name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run check

  go-build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runwisp/go.mod
          cache-dependency-path: apps/runwisp/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bunx nx run-many -t test --exclude=@runwisp/web-ui --outputStyle=stream

  check-generated:
    name: Check Generated Code is Fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runwisp/go.mod
          cache-dependency-path: apps/runwisp/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Generate OpenAPI spec from Go app
        run: bun run openapi -- --verbose
        working-directory: apps/runwisp

      - name: Generate AsyncAPI types (TS Zod + Go structs)
        run: bun run generate
        working-directory: packages/asyncapi

      - name: Generate API types (TS from OpenAPI)
        run: bun run generate:api
        working-directory: packages/common

      - name: Fail if generated files are stale
        run: git diff --exit-code

  e2e:
    name: Browser E2E Tests
    runs-on: ubuntu-latest
    needs: go-build-and-test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runwisp/go.mod
          cache-dependency-path: apps/runwisp/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build RunWisp binary (UI + Go)
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/ui

      - name: Run E2E tests
        run: bun run test
        working-directory: apps/ui

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/ui/test-results/
          retention-days: 7
