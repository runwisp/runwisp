name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-generated:
    name: Check Generated Code is Fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # On PRs, moon diffs changed files against vcs.defaultBranch, but the
      # checkout only has the merge ref — give it a local `main` to resolve.
      - name: Fetch base branch for moon
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin main:main

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runwisp/go.mod
          cache-dependency-path: apps/runwisp/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Regenerate all (sqlc, AsyncAPI, OpenAPI, common API types)
        run: bun run generate

      - name: Fail if generated files are stale
        run: git diff --exit-code

  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch base branch for moon
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin main:main

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runwisp/go.mod
          cache-dependency-path: apps/runwisp/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check
        run: bun run check

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Fetch base branch for moon
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin main:main

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runwisp/go.mod
          cache-dependency-path: apps/runwisp/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: runwisp-binary-${{ matrix.os }}
          path: apps/runwisp/runwisp
          retention-days: 1

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The podman SMTP e2e tests pull a container image over the network, which
    # is non-hermetic and flaky in CI (and hung the ubuntu runner's `podman run`
    # for the full test timeout). ubuntu-latest ships podman, so requirePodman
    # would otherwise run them; skip them everywhere — the in-process SMTP fake
    # covers the no-deps path. Run them locally with podman to exercise real TLS.
    env:
      RUNWISP_SKIP_PODMAN_TESTS: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Fetch base branch for moon
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin main:main

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runwisp/go.mod
          cache-dependency-path: apps/runwisp/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Create UI placeholder for go:embed
        run: |
          mkdir -p apps/runwisp/internal/ui/dist
          echo '<!-- placeholder for go:embed -->' > apps/runwisp/internal/ui/dist/index.html

      - name: Test
        run: bun run test

      - name: Upload Go coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: apps/runwisp/coverage.out
          retention-days: 1

      - name: Upload UI coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui
          path: apps/ui/coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    # Forks and Dependabot PRs don't have access to SONAR_TOKEN; skip rather than fail noisily.
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # disable shallow clones for relevant analysis

      - name: Download Go coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-go
          path: apps/runwisp

      - name: Download UI coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-ui
          path: apps/ui/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # On PRs, moon diffs changed files against vcs.defaultBranch, but the
      # checkout only has the merge ref — give it a local `main` to resolve.
      - name: Fetch base branch for moon
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin main:main

      # Lint and unit-test the shell first: these need no Go toolchain, no bun,
      # and no image, so a broken entrypoint fails the job in seconds instead of
      # after a multi-minute build.
      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh docker/docker-entrypoint.sh docker/tests/entrypoint_test.sh
          shellcheck docker/build-local.sh docker/tests/smoke.sh
          shellcheck apps/runwisp/scripts/package-all.sh apps/runwisp/scripts/tests/package-all_test.sh

      - name: Entrypoint unit tests (dash and bash)
        run: |
          for shell in dash bash; do
            echo "::group::entrypoint under ${shell}"
            ENTRYPOINT_SH="${shell}" sh docker/tests/entrypoint_test.sh
            echo "::endgroup::"
          done

      # Guards the release packaging: a tarball must ship an executable runwisp.
      - name: Release packaging unit tests
        run: apps/runwisp/scripts/tests/package-all_test.sh

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/runwisp/go.mod
          cache-dependency-path: apps/runwisp/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build web UI and sync into Go embed directory
        run: bunx moon run runwisp:sync-ui-dist

      # Build the binary once and feed it to both bases via --dist. Letting each
      # build-local.sh invocation compile from source cross-compiles the same
      # target twice.
      - name: Build the linux/amd64 binary
        working-directory: apps/runwisp
        run: TARGETS=linux-x64 RELEASE=1 ./scripts/build-all.sh

      - name: Build alpine and debian images (linux/amd64)
        run: |
          ./docker/build-local.sh --base alpine --dist apps/runwisp/dist --load -t runwisp:ci-alpine
          ./docker/build-local.sh --base debian --dist apps/runwisp/dist --load -t runwisp:ci-debian

      # The entrypoint's own shell differs by base — busybox ash on alpine, dash
      # on debian — so run the unit tests inside each image too, against the
      # shell that will actually interpret them in production.
      - name: Entrypoint unit tests inside each image
        run: |
          for image in runwisp:ci-alpine runwisp:ci-debian; do
            echo "::group::${image}"
            docker run --rm -v "${PWD}/docker:/docker:ro" --entrypoint sh "${image}" \
              /docker/tests/entrypoint_test.sh
            echo "::endgroup::"
          done

      - name: Container smoke tests
        run: |
          for image in runwisp:ci-alpine runwisp:ci-debian; do
            echo "::group::${image}"
            ./docker/tests/smoke.sh "${image}"
            echo "::endgroup::"
          done

      - name: Smoke test — serves /health and shuts down cleanly (both bases)
        run: |
          mkdir -p /tmp/runwisp-ci
          cat > /tmp/runwisp-ci/runwisp.toml <<'EOF'
          [tasks.hello]
          run = "echo hello from container"
          run_on_start = true
          EOF

          for image in runwisp:ci-alpine runwisp:ci-debian; do
            echo "::group::${image}"
            docker run -d --name runwisp-ci -e RUNWISP_NO_AUTH=1 -p 19477:9477 \
              -v /tmp/runwisp-ci/runwisp.toml:/etc/runwisp/runwisp.toml:ro "${image}"

            for _ in $(seq 1 20); do
              if curl -sf http://localhost:19477/health >/dev/null; then break; fi
              sleep 0.5
            done
            curl -sf http://localhost:19477/health

            docker stop runwisp-ci
            status=$(docker inspect runwisp-ci --format '{{.State.ExitCode}}')
            docker logs runwisp-ci
            docker rm runwisp-ci

            if [ "${status}" != "0" ]; then
              echo "expected exit code 0 on graceful stop, got ${status}" >&2
              exit 1
            fi
            echo "::endgroup::"
          done

  e2e:
    name: Browser E2E Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download binary
        uses: actions/download-artifact@v7
        with:
          name: runwisp-binary-${{ matrix.os }}
          path: apps/runwisp

      - name: Make binary executable
        run: chmod +x apps/runwisp/runwisp

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/ui

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: bunx playwright install-deps chromium
        working-directory: apps/ui

      # Not moon's runwisp:test-e2e — that would rebuild the binary; this job
      # runs against the one downloaded from the `build` job.
      - name: Run E2E tests
        run: bunx playwright test
        working-directory: apps/ui

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/ui/test-results/
          retention-days: 7
