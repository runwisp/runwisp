sonar.organization=runwisp
sonar.projectKey=runwisp_runwisp
sonar.sources=apps,packages,Dockerfile.devcontainer,.github
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.spec.ts,**/e2e/**,**/tests/**
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.svelte-kit/**,\
  **/.scannerwork/**,\
  apps/runwisp/internal/generated/**,\
  packages/common/src/generated/**,\
  packages/asyncapi/src/generated/**,\
  apps/runwisp/openapi.json,\
  apps/runwisp/internal/ui/dist/**

# Coverage. Reports are produced by `make test` (go test -coverprofile + vitest --coverage).
sonar.go.coverage.reportPaths=apps/runwisp/coverage.out
sonar.javascript.lcov.reportPaths=apps/ui/coverage/lcov.info
# Coverage exclusions: things that are either generated, build tooling,
# OS-specific (can't run on the Linux CI runner), pure type/constant modules,
# bootstrap wiring driven by the framework (SvelteKit routes/hooks), trivial
# 1-line wrappers around stdlib/third-party calls, or e2e-only entry points.
# The goal is "lower % but higher truth": exclude what unit tests can't
# meaningfully cover, then keep the remaining surface honest.
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/*.test.ts,\
  **/*.spec.ts,\
  apps/runwisp/cmd/e2e-fake-daemon/**,\
  apps/runwisp/tests/**,\
  apps/ui/test/**,\
  apps/ui/playwright/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.config.cjs,\
  **/scripts/**,\
  apps/docs/**,\
  packages/eslint-config/**,\
  packages/typescript-config/**,\
  packages/asyncapi/src/generated/**,\
  apps/runwisp/internal/generated/**,\
  apps/runwisp/internal/storage/sqlcdb/**,\
  packages/common/src/generated/**,\
  apps/runwisp/internal/server/peercred_darwin.go,\
  apps/runwisp/cmd/runwisp/daemon_lifecycle.go,\
  apps/runwisp/cmd/runwisp/cmd_default.go,\
  **/internal/testutil/**,\
  **/notify/testutil/**,\
  apps/ui/src/routes/**,\
  apps/ui/src/hooks.client.ts,\
  apps/ui/src/lib/api.ts,\
  apps/ui/src/lib/adapters/browser.ts,\
  apps/ui/src/lib/utils/env.ts,\
  apps/ui/src/lib/utils/log-session.ts,\
  apps/ui/src/lib/logs.ts,\
  apps/ui/src/lib/stores/data.svelte.ts,\
  apps/ui/src/lib/stores/system.svelte.ts,\
  apps/ui/src/lib/stores/run-updates.ts,\
  apps/ui/src/lib/stores/auth.svelte.ts,\
  apps/ui/src/lib/stores/event-manager.svelte.ts,\
  apps/ui/src/lib/stores/notifications.svelte.ts,\
  apps/ui/src/lib/stores/connection.svelte.ts,\
  apps/ui/src/lib/utils/async-data.svelte.ts,\
  packages/ui/src/lib/components/button-styles.ts,\
  packages/ui/src/lib/components/dashboard/status-config.ts,\
  packages/ui/src/lib/actions/portal.ts,\
  packages/ui/src/lib/utils/toast.ts,\
  packages/ui/src/lib/utils/toast.svelte.ts,\
  packages/ui/src/lib/log-console/types.ts,\
  packages/ui/src/lib/log-console/LogCache.svelte.ts,\
