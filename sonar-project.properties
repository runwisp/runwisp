# Copy-paste (CPD) exclusions. sqlc query templates are named, standalone
# statements: a list query and its companion count/soft-delete query must
# repeat the same WHERE/filter block verbatim because sqlc has no include or
# macro mechanism to share a clause. The "duplication" is structural, not a
# refactorable smell — exclude the query dir from the CPD metric (the related
# plsql:S1192 issue rule is already disabled below for the same reason).
sonar.cpd.exclusions=apps/runwisp/internal/storage/query/**

# ── SUPPRESSION POLICY (keep suppressions move-proof) ────────────────────────
# Sonar findings resurface when a suppression detaches from the code it covers.
# Two failure modes, two rules:
#   1. Inline `//NOSONAR` only silences the line it sits ON. It must be on the
#      exact line Sonar flags — the taint SINK, not a nearby sanitizer. When the
#      flagged line and the marker live in different statements, a later refactor
#      separates them and the finding comes back (this bit internal/ui/serve.go:
#      the marker was on the path.Clean line but S2083 flags the Open sink).
#      Put `//NOSONAR` on the flagged statement and keep them in one function.
#   2. The multicriteria rules below match by `resourceKey` glob. Keep those
#      globs LANGUAGE-WIDE (`**/*.ext`) so moving a file between directories
#      never un-matches them. Only scope a resourceKey to a path when the rule
#      is genuinely location-bound (s8543gha → workflows, s1607shots → the
#      screenshots harness); a path-scoped key silently lapses if that code moves.
# ─────────────────────────────────────────────────────────────────────────────
# Disable noisy rules where the "fix" hurts readability more than it helps.
# S1192: "define a constant instead of duplicating literal" — default 3-use
#   threshold turns short same-file format strings into pointless indirection.
# S1186: "empty function bodies must have a comment" — a well-named no-op
#   (e.g. cancelCloud = func() {}) is already self-explanatory.
# S3776: "cognitive complexity" — in test files, the deliberate explicit
#   shape (nested ternaries, long describe/it chains, table rows) is the
#   point. Scoping the rule out of test files keeps the production-code
#   signal while letting tests stay readable in their own idiom.
# plsql:S1192: our .sql files are SQLite query templates consumed by sqlc,
#   not PL/SQL — there's no "constant" construct to extract a literal to. The
#   duplications Sonar flags are sqlc.arg() identifiers and short enum string
#   sets repeated inside a single query.
# githubactions:S8543: "define an exact package version" for `bunx playwright`.
#   The version is already pinned: `bun install --frozen-lockfile` installs the
#   exact Playwright from bun.lock right before `bunx` runs the local binary.
#   Re-pinning `playwright@x.y.z` inline would duplicate that version and create
#   drift between the lockfile and the workflow.
# godre:S8242: "remove this context.Context field and pass context as parameter".
#   Both flagged fields hold a context that owns a lifecycle, not a per-call
#   value: server/access_log.go's slogAccessEntry must capture r.Context() at
#   NewLogEntry time because chi's LogEntry.Write has no context parameter, and
#   runtime/persistence.go's PersistenceCoordinator stores its worker ctx as the
#   "stop accepting new work" signal. Passing context as a parameter doesn't fit
#   either shape, so the rule is noise here.
# typescript:S4782: "'undefined' type or '?' specifier is redundant". The project
#   compiles with exactOptionalPropertyTypes, under which `x?: T | undefined` is
#   meaningfully distinct from `x?: T` — only the former allows an explicit
#   `{ ...f, x: undefined }` reassignment, which the filter code relies on to
#   clear a dimension. Dropping either half (the rule's "fix") fails to compile.
# typescript/javascript:S3735: "remove this use of the void operator". `void`
#   prefixing a deliberately un-awaited promise is the canonical way to satisfy
#   @typescript-eslint/no-floating-promises (error in our config). The rule's
#   "fix" would trip the lint, so the two are mutually exclusive — eslint wins.
# typescript:S1607: "remove this skipped test or explain why". The only match is
#   a Playwright `test.skip(condition, reason)` conditional skip that already
#   carries a reason — it runs whenever the frame fixtures exist, so it isn't a
#   disabled test. Scoped to the screenshots harness only.
sonar.issue.ignore.multicriteria=s1192go,s1192ts,s1192js,s1186go,s1186ts,s3776testts,s3776testjs,s3776testgo,s1192sql,s8543gha,s8242go,s4782ts,s3735ts,s3735js,s1607shots
