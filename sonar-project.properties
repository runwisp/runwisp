# Disable noisy rules where the "fix" hurts readability more than it helps.
# S1192: "define a constant instead of duplicating literal" — default 3-use
#   threshold turns short same-file format strings into pointless indirection.
# S1186: "empty function bodies must have a comment" — a well-named no-op
#   (e.g. cancelCloud = func() {}) is already self-explanatory.
# S3776: "cognitive complexity" — in test files, the deliberate explicit
#   shape (nested ternaries, long describe/it chains, table rows) is the
#   point. Scoping the rule out of test files keeps the production-code
#   signal while letting tests stay readable in their own idiom.
# plsql:S1192: our .sql files are SQLite query templates consumed by sqlc,
#   not PL/SQL — there's no "constant" construct to extract a literal to. The
#   duplications Sonar flags are sqlc.arg() identifiers and short enum string
#   sets repeated inside a single query.
# githubactions:S8543: "define an exact package version" for `bunx playwright`.
#   The version is already pinned: `bun install --frozen-lockfile` installs the
#   exact Playwright from bun.lock right before `bunx` runs the local binary.
#   Re-pinning `playwright@x.y.z` inline would duplicate that version and create
#   drift between the lockfile and the workflow.
sonar.issue.ignore.multicriteria=s1192go,s1192ts,s1192js,s1186go,s1186ts,s3776testts,s3776testjs,s3776testgo,s1192sql,s8543gha
sonar.issue.ignore.multicriteria.s1192go.ruleKey=go:S1192
