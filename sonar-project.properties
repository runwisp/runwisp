# Coverage. Reports are produced by `make test` (go test -coverprofile + vitest --coverage).
sonar.go.coverage.reportPaths=apps/runwisp/coverage.out
sonar.javascript.lcov.reportPaths=apps/ui/coverage/lcov.info
# Coverage exclusions: things that are either generated, build tooling,
# OS-specific (can't run on the Linux CI runner), pure type/constant modules,
# bootstrap wiring driven by the framework (SvelteKit routes/hooks), trivial
# 1-line wrappers around stdlib/third-party calls, or e2e-only entry points.
# The goal is "lower % but higher truth": exclude what unit tests can't
# meaningfully cover, then keep the remaining surface honest.
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/*.test.ts,\
  **/*.spec.ts,\
  apps/runwisp/cmd/e2e-fake-daemon/**,\
  apps/runwisp/tests/**,\
  apps/ui/test/**,\
  apps/ui/playwright/**,\
  **/*.config.ts,\
  **/*.config.js,\
