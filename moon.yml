$schema: 'https://moonrepo.dev/schemas/project.json'

# Workspace orchestration; the root package.json scripts alias these targets.
# The `ci` script chains separate moon invocations because format mutates
# files that check/test read, and moon deps can't express that barrier.
layer: 'automation'

tasks:
  generate:
    # Ordered: common:generate-api reads the openapi.json that runwisp:openapi
    # writes; that edge can't be a task dep (see common/moon.yml).
    description: 'Regenerate sqlc + AsyncAPI + openapi.json + common API types.'
    deps:
      - 'runwisp:openapi'
      - 'common:generate-api'
    options:
      cache: false
      runDepsInParallel: false

  format:
    deps:
      - 'runwisp:format'
      - 'web-ui:format'
      - 'docs:format'
      - 'ui:format'
    options:
      cache: false

  check-installed-deps:
    description: 'Verify node_modules matches every workspace manifest.'
    command: 'bun scripts/check-installed-deps.ts'
    inputs:
      - 'scripts/check-installed-deps.ts'
      - 'package.json'
      - 'bun.lock'
      - 'apps/*/package.json'
      - 'packages/*/package.json'

  check:
    deps:
      - '~:check-installed-deps'
      - 'runwisp:check'
      - 'web-ui:check'
      # docs:build, not just docs:check — `astro check` type-checks the sources
      # but never runs the MDX→JSX compile or the prerender pass, so an Astro or
      # transitive-dep break can pass `check` cleanly and fail only on
      # Cloudflare after push. Building here is the only thing that catches it.
      - 'docs:check'
      - 'docs:build'
      - 'ui:check'
      - 'common:check'
      - 'asyncapi:check'
    options:
      cache: false

  test:
    deps:
      - 'runwisp:test'
      - 'web-ui:test'
    options:
      cache: false
