$schema: 'https://moonrepo.dev/schemas/project.json'

# Workspace orchestration. The root package.json scripts are aliases onto
# these targets. The `ci` alias chains three moon invocations with && because
# stages need true barriers: format mutates the files that check/test read,
# and moon deps can't express transitive stage barriers (runDepsInParallel
# only orders the listed targets, not their dep subtrees).
layer: 'automation'

tasks:
  generate:
    # Ordered, not parallel: common:generate-api reads the openapi.json that
    # runwisp:openapi writes, and that edge can't be a task dep (it would
    # cycle the project graph — runwisp depends on web-ui depends on common).
    description: 'Regenerate sqlc + AsyncAPI + openapi.json + common API types.'
    deps:
      - 'runwisp:openapi'
      - 'common:generate-api'
    options:
      cache: false
      runDepsInParallel: false

  format:
    deps:
      - 'runwisp:format'
      - 'web-ui:format'
      - 'docs:format'
      - 'ui:format'
    options:
      cache: false

  check:
    deps:
      - 'runwisp:check'
      - 'web-ui:check'
      - 'docs:check'
      - 'ui:check'
      - 'common:check'
      - 'asyncapi:check'
    options:
      cache: false

  test:
    deps:
      - 'runwisp:test'
      - 'web-ui:test'
    options:
      cache: false
